function exportJSON(){
  var data = { app:'woongjin12-dashboard', appVersion:1, region:REGION_NAME, exportedAt:new Date().toISOString() };
  for (var k in state) data[k] = state[k];
  var text = JSON.stringify(data, null, 2);
  try {
    var blob = new Blob([text], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '대구중부12지역국-대시보드-'+today()+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      URL.revokeObjectURL(a.href);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 2500);
    toast('기록을 파일로 내보냈어요!');
  } catch(e){
    toast('내보내기에 실패했어요. 다른 브라우저에서 시도해 주세요.');
  }
}
function importJSON(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(String(reader.result));
      if (!data || typeof data !== 'object' || (!data.schedules && !data.stats)) throw new Error('bad');
      state = normalize(data);
      save();
      closeModal();
      renderAll();
      toast('기록을 그대로 불러왔어요!');
    } catch(e){
      toast('파일을 읽지 못했어요. 내보낸 JSON 파일인지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
}

/* ---------- 11. 페이지 넘김 ---------- */
var pagerEl = null, trackEl = null;
var posPx = 0;
var animTimer = 0, wheelLock = 0, suppressClickUntil = 0;
var slide = null;

function tabIndexOf(tab){ var i = TAB_ORDER.indexOf(tab); return i < 0 ? 0 : i; }
function pagerWidth(){ return pagerEl ? (pagerEl.clientWidth || 1) : 1; }
function clampIdx(i){ return Math.max(0, Math.min(TAB_ORDER.length - 1, i)); }
function modalOpen(){ var r = el('modalRoot'); return !!(r && r.classList.contains('on')); }
function currentIdx(){
  if (!pagerEl) return tabIndexOf((state.ui && state.ui.tab) || 'home');
  return clampIdx(Math.round(posPx / pagerWidth()));
}
function applyPos(px, animate){
  posPx = px;
  if (!trackEl) return;
  if (animate){
    trackEl.classList.add('animating');
    clearTimeout(animTimer);
    animTimer = setTimeout(function(){ trackEl.classList.remove('animating'); }, 380);
  } else {
    trackEl.classList.remove('animating');
  }
  trackEl.style.transform = 'translate3d(' + (-px) + 'px,0,0)';
}
function syncChrome(tab, pos){
  var btns = document.querySelectorAll('.tabbar button');
  for (var i=0;i<btns.length;i++){
    var on = btns[i].getAttribute('data-tab') === tab;
    btns[i].classList.toggle('active', on);
    if (on) btns[i].setAttribute('aria-current','page'); else btns[i].removeAttribute('aria-current');
  }
  var dots = document.querySelectorAll('#pind button');
  if (pos == null) pos = tabIndexOf(tab);
  for (var j=0;j<dots.length;j++){
    var d = Math.abs(pos - j);
    var near = d < 0.5;
    dots[j].classList.toggle('on', near);
    dots[j].setAttribute('aria-selected', near ? 'true' : 'false');
    dots[j].style.setProperty('--k', Math.max(0, 1 - Math.min(1, d)).toFixed(3));
  }
}
function goToTab(tab, opts){
  opts = opts || {};
  var idx = tabIndexOf(tab);
  state.ui.tab = tab;
  if (!pagerEl){ syncChrome(tab, idx); return; }
  var left = idx * pagerWidth();
  if (opts.instant){
    applyPos(left, false);
    syncChrome(tab, idx);
    return;
  }
  applyPos(left, true);
  syncChrome(tab, idx);
  save();
}
function settleTo(idx){
  idx = clampIdx(idx);
  state.ui.tab = TAB_ORDER[idx];
  if (pagerEl) applyPos(idx * pagerWidth(), true);
  syncChrome(state.ui.tab, idx);
  save();
}
function dragStart(e){
  if (!pagerEl || slide) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var t = e.target;
  if (t && t.closest && t.closest('.who-tabs, .dp-people, input, textarea, select')) return;
  if (trackEl){
    var m = getComputedStyle(trackEl).transform;
    if (m && m !== 'none'){ try { posPx = -new DOMMatrixReadOnly(m).m41; } catch(err){} }
    trackEl.classList.remove('animating');
  }
  slide = {
    id:e.pointerId, type:e.pointerType || 'mouse',
    x:e.clientX, y:e.clientY, pos:posPx, idx:currentIdx(),
    dir:null, moved:0, lastX:e.clientX, lastT:performance.now(), vel:0
  };
}
function dragMove(e){
  if (!slide || e.pointerId !== slide.id) return;
  var dx = e.clientX - slide.x, dy = e.clientY - slide.y;
  if (!slide.dir){
    if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
    slide.dir = Math.abs(dx) > Math.abs(dy) * 1.25 ? 'x' : 'y';
    if (slide.dir === 'x'){
      pagerEl.classList.add('dragging');
      try { pagerEl.setPointerCapture(e.pointerId); } catch(err){}
    } else { slide = null; return; }
  }
  if (e.cancelable) e.preventDefault();
  slide.moved = Math.max(slide.moved, Math.abs(dx));
  var now = performance.now(), dt = now - slide.lastT;
  if (dt > 0) slide.vel = (e.clientX - slide.lastX) / dt;
  slide.lastX = e.clientX; slide.lastT = now;

  var w = pagerWidth(), max = (TAB_ORDER.length - 1) * w;
  var raw = slide.pos - dx;
  if (raw < 0) raw = raw * 0.34;
  else if (raw > max) raw = max + (raw - max) * 0.34;
  applyPos(raw, false);
  syncChrome(TAB_ORDER[clampIdx(Math.round(raw / w))], raw / w);
}
function dragEnd(e){
  if (!slide || (e && e.pointerId !== slide.id)) return;
  var s = slide;
  slide = null;
  if (s.dir !== 'x') return;
  pagerEl.classList.remove('dragging');
  var w = pagerWidth();
  var movedPx = posPx - s.pos;
  var target = s.idx;
  var dist = Math.abs(movedPx), speed = Math.abs(s.vel);
  if (dist > 6){
    var far = dist > w * 0.22;
    var flick = speed > 0.55 && dist > w * 0.12;
    if (far || flick){
      var dirn = movedPx !== 0 ? movedPx : -s.vel;
      target = s.idx + (dirn > 0 ? 1 : -1);
    }
  }
  if (s.moved > 6) suppressClickUntil = performance.now() + 400;
  settleTo(target);
}
function onWheel(e){
  if (!pagerEl) return;
  var t = e.target;
  if (t && t.closest && t.closest('.who-tabs, .dp-people')) return;
  var dx = e.deltaX, dy = e.deltaY;
  if (e.shiftKey && Math.abs(dy) > Math.abs(dx)) { dx = dy; dy = 0; }
  if (Math.abs(dx) <= Math.abs(dy) * 1.2) return;
  if (Math.abs(dx) < 12) return;
  e.preventDefault();
  var now = performance.now();
  if (now < wheelLock) return;
  wheelLock = now + 520;
  var cur = currentIdx();
  var next = clampIdx(cur + (dx > 0 ? 1 : -1));
  if (next !== cur) goToTab(TAB_ORDER[next]);
}
function initPager(){
  pagerEl = el('pager');
  trackEl = el('track');
  if (!pagerEl || !trackEl) return;
  applyPos(tabIndexOf((state.ui && state.ui.tab) || 'home') * pagerWidth(), false);

  pagerEl.addEventListener('pointerdown', dragStart);
  pagerEl.addEventListener('pointermove', dragMove);
  pagerEl.addEventListener('pointerup', dragEnd);
  pagerEl.addEventListener('pointercancel', dragEnd);
  pagerEl.addEventListener('dragstart', function(e){ e.preventDefault(); });
  pagerEl.addEventListener('wheel', onWheel, { passive:false });

  var rt = 0;
  window.addEventListener('resize', function(){
    if (rt) return;
    rt = setTimeout(function(){
      rt = 0;
      if (!pagerEl) return;
      applyPos(tabIndexOf(state.ui.tab) * pagerWidth(), false);
      syncChrome(state.ui.tab, tabIndexOf(state.ui.tab));
    }, 120);
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){
      if (!pagerEl) return;
      applyPos(tabIndexOf(state.ui.tab) * pagerWidth(), false);
    }, 220);
  });
}
document.addEventListener('click', function(e){
  if (performance.now() < suppressClickUntil && pagerEl && pagerEl.contains(e.target)){
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

function addSchedule(o){
  var s = {
    id: uid('sc'),
    kind: o.kind === 'weekly' ? 'weekly' : 'date',
    day: o.kind === 'weekly' ? Number(o.day) || 1 : null,
    date: o.kind === 'date' ? (o.date || today()) : null,
    endDate: o.kind === 'date' && o.endDate ? o.endDate : null,
    start: o.start || '', end: o.end || '',
    title: o.title || '새 일정',
    short: o.short || '',
    owner: o.owner || 'common',
    note: o.note || ''
  };
  state.schedules.push(s);
  save();
  return s;
}
function updateSchedule(id, patch){
  var s = state.schedules.filter(function(x){ return x.id === id; })[0];
  if (!s) return null;
  for (var k in patch) s[k] = patch[k];
  save();
  return s;
}
function removeSchedule(id){
  state.schedules = state.schedules.filter(function(x){ return x.id !== id; });
  save();
}

document.addEventListener('change', function(e){
  var t = e.target;
  if (!t) return;
  if (t.id === 'importFile') {
    importJSON(t.files && t.files[0]);
    return;
  }
  var act = t.getAttribute ? t.getAttribute('data-act') : null;
  if (act !== 'statRatioCur' && act !== 'statRatioTotal') return;
  var rOwner = t.getAttribute('data-owner'), rId = t.getAttribute('data-id');
  var rItem = statsOf(rOwner).filter(function(x){ return x.id === rId; })[0];
  if (!rItem || !statIsRatio(rItem)) return;
  var rWasAllStar = allStarOf(rOwner).on;
  var rWasDone = statReached(rItem);
  syncRatioFromDom(rItem);
  save();
  /* 누른 버튼이 사라지지 않도록 실적 행은 다시 그리지 않고 머리말·조건바만 갱신 */
  refreshStatsChrome(rOwner);
  if (!rWasDone && statReached(rItem)) {
    celebrate('🏅', rItem.label+' '+RATIO_GOAL+'% 달성!', ratioPctText(ratioPct(rItem))+' · '+ownerById(rOwner).short+' 실적');
    chime();
  } else if (!rWasAllStar && allStarOf(rOwner).on) {
    celebrate('🌟', ownerById(rOwner).short+' All Star 달성!', '모든 실적 항목이 목표 이상이에요');
    chime();
  }
});

/* 인원 입력칸은 타이핑 중에는 화면을 다시 그리지 않고 값만 저장 (커서·키보드 유지) */
document.addEventListener('input', function(e){
  var t = e.target;
  var act = t && t.getAttribute ? t.getAttribute('data-act') : null;
  if (act !== 'statRatioCur' && act !== 'statRatioTotal') return;
  var iOwner = t.getAttribute('data-owner'), iId = t.getAttribute('data-id');
  var iItem = statsOf(iOwner).filter(function(x){ return x.id === iId; })[0];
  if (!iItem || !statIsRatio(iItem)) return;
  if (act === 'statRatioCur') {
    var iPrev = statCur(iItem);
    iItem.cur = clampPeople(t.value);
    /* 연동 항목이면 타이핑 중에도 바뀐 만큼 위 담당자 실적에 바로 더한다 */
    var iDelta = roundDelta(statCur(iItem) - iPrev);
    if (iDelta) {
      addStatDelta(iOwner, iId, iDelta);
      refreshStatsChrome(iOwner);   /* 탭의 달성 수·All Star 표시도 같이 */
    }
  } else {
    iItem.total = clampPeople(t.value);
  }
  save();
  refreshRatioRow(iItem);   /* 타이핑 중에도 %·진행 바·안내가 바로 따라온다 */
});

/* ---------- 13b. 비밀번호 잠금 ----------
   공개 주소에 올라가는 파일이라 비밀번호(4자리)는 소스에 그대로 적지 않고
   SHA-256 해시하고만 비교합니다. 한 번 풀면 이 기기의 localStorage 에
   표시를 남겨 다음에 열 때는 바로 대시보드가 나옵니다. */
var LOCK_KEY = 'woongjinDashboard.lock.v1';
/* 업무 비밀번호 4자리의 SHA-256 해시 (평문은 파일에 두지 않습니다) */
var PIN_HASH = '7a98c22ae38c33c9c2e582c4e09a8d4b2b7f109bcfc099cccf49d4519e774e16';
var PIN_LEN = 4;
var lockBusy = false;

/* 문자열 → UTF-8 바이트 */
function utf8Bytes(str){
  str = String(str == null ? '' : str);
  if (window.TextEncoder) { try { return new TextEncoder().encode(str); } catch (e) {} }
  var out = [];
  for (var i = 0; i < str.length; i++){
    var c1 = str.charCodeAt(i);
    if (c1 < 0x80) out.push(c1);
    else if (c1 < 0x800) out.push(0xC0 | (c1 >> 6), 0x80 | (c1 & 63));
    else if (c1 >= 0xD800 && c1 <= 0xDBFF && i + 1 < str.length){
      var c2 = str.charCodeAt(i + 1);
      var cp = 0x10000 + ((c1 - 0xD800) << 10) + (c2 - 0xDC00);
      out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      i++;
    } else out.push(0xE0 | (c1 >> 12), 0x80 | ((c1 >> 6) & 63), 0x80 | (c1 & 63));
  }
  return new Uint8Array(out);
}
function hexOf(bytes){
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
  return s;
}

/* 비보안 컨텍스트(file:// 등)에서도 같은 해시를 얻기 위한 SHA-256 폴백.
   crypto.subtle 이 없을 때만 쓰입니다. */
function sha256FallbackHex(str){
  function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = utf8Bytes(str), len = bytes.length;
  var total = Math.ceil((len + 9) / 64) * 64;
  var msg = new Uint8Array(total);
  msg.set(bytes);
  msg[len] = 0x80;
  var bitsHi = Math.floor(len * 8 / 4294967296), bitsLo = (len * 8) >>> 0;
  msg[total - 8] = (bitsHi >>> 24) & 255; msg[total - 7] = (bitsHi >>> 16) & 255;
  msg[total - 6] = (bitsHi >>> 8) & 255;  msg[total - 5] = bitsHi & 255;
  msg[total - 4] = (bitsLo >>> 24) & 255; msg[total - 3] = (bitsLo >>> 16) & 255;
  msg[total - 2] = (bitsLo >>> 8) & 255;  msg[total - 1] = bitsLo & 255;

  var w = new Array(64);
  for (var off = 0; off < total; off += 64){
    for (var t = 0; t < 16; t++){
      w[t] = (msg[off + t * 4] << 24) | (msg[off + t * 4 + 1] << 16) | (msg[off + t * 4 + 2] << 8) | msg[off + t * 4 + 3];
    }
    for (t = 16; t < 64; t++){
      var s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      var s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (t = 0; t < 64; t++){
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  var out = new Uint8Array(32);
  for (var i2 = 0; i2 < 8; i2++){
    out[i2 * 4] = (H[i2] >>> 24) & 255; out[i2 * 4 + 1] = (H[i2] >>> 16) & 255;
    out[i2 * 4 + 2] = (H[i2] >>> 8) & 255; out[i2 * 4 + 3] = H[i2] & 255;
  }
  return hexOf(out);
}

/* SHA-256 16진 문자열 (Promise) — https 에서는 crypto.subtle, 아니면 폴백 */
function sha256Hex(str){
  var c = window.crypto;
  if (c && c.subtle && typeof c.subtle.digest === 'function' && window.isSecureContext !== false){
    try {
      return c.subtle.digest('SHA-256', utf8Bytes(str)).then(function(buf){
        return hexOf(new Uint8Array(buf));
      }, function(){ return sha256FallbackHex(str); });
    } catch (e) { /* 아래 폴백으로 */ }
  }
  return Promise.resolve().then(function(){ return sha256FallbackHex(str); });
}

function lockedNow(){ return document.documentElement.classList.contains('locked'); }
/* 잠금 중에는 화면 낭독기·키보드에서도 대시보드 내용이 잡히지 않도록 */
function applyLockInert(){
  var on = lockedNow();
  var nodes = document.querySelectorAll('.topbar, .pind, #pager, .tabbar');
  for (var i = 0; i < nodes.length; i++){
    try { nodes[i].inert = on; } catch (e) {}
  }
}
function setPinMsg(text, ok){
  var m = el('pinMsg');
  if (!m) return;
  m.textContent = text || '';
  m.className = 'pin-msg' + (ok ? ' ok' : '');
}
function shakeLock(){
  var card = el('lockCard');
  if (!card) return;
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  setTimeout(function(){ card.classList.remove('shake'); }, 420);
}
function clearPin(){
  var inp = el('lockPin');
  if (inp) inp.value = '';
}

function lockNow(){
  if (typeof closeModal === 'function') closeModal();
  document.documentElement.classList.add('locked');
  try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
  lockBusy = false;
  clearPin();
  setPinMsg('');
  applyLockInert();
  var sc = el('lockScreen');
  if (sc) sc.scrollTop = 0;
}

function unlockNow(){
  document.documentElement.classList.remove('locked');
  applyLockInert();
  try { localStorage.setItem(LOCK_KEY, '1'); } catch (e) {}
  lockBusy = false;
  clearPin();
  setPinMsg('');
  if (typeof toast === 'function') toast('잠금을 풀었어요 🔓');
}

/* 키패드·키보드에서 들어온 한 자리 */
function pinPress(key){
  if (!lockedNow()) return;
  var inp = el('lockPin');
  if (!inp) return;
  if (key === 'del'){
    inp.value = inp.value.slice(0, -1);
    setPinMsg('');
    return;
  }
  if (key === 'ok'){ submitPin(); return; }
  if (!/^[0-9]$/.test(String(key))) return;
  if (inp.value.length >= PIN_LEN) return;
  if (inp.value) setPinMsg('');
  inp.value += key;
  if (inp.value.length === PIN_LEN) setTimeout(submitPin, 150);
}

function submitPin(){
  if (lockBusy || !lockedNow()) return;
  var inp = el('lockPin');
  var val = (inp ? inp.value : '').replace(/[^0-9]/g, '');
  if (inp && val !== inp.value) inp.value = val;
  if (val.length < PIN_LEN){ setPinMsg('비밀번호 '+PIN_LEN+'자리를 모두 입력해 주세요'); return; }
  lockBusy = true;
  setPinMsg('확인 중…', true);
  sha256Hex(val).then(function(hex){
    if (hex === PIN_HASH){
      unlockNow();
      return;
    }
    lockBusy = false;
    clearPin();
    setPinMsg('비밀번호가 맞지 않아요. 다시 입력해 주세요.');
    shakeLock();
  }, function(){
    lockBusy = false;
    setPinMsg('확인하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  });
}

function initLock(){
  var pad = el('pinPad'), inp = el('lockPin');
  if (pad){
    pad.addEventListener('click', function(e){
      var b = e.target && e.target.closest ? e.target.closest('[data-pin]') : null;
      if (!b) return;
      e.preventDefault();
      pinPress(b.getAttribute('data-pin'));
    });
  }
  if (inp){
    inp.addEventListener('input', function(){
      var clean = inp.value.replace(/[^0-9]/g, '').slice(0, PIN_LEN);
      if (clean !== inp.value) inp.value = clean;
      if (clean) setPinMsg('');
      if (clean.length === PIN_LEN) setTimeout(submitPin, 150);
    });
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); submitPin(); }
    });
  }
  /* 키패드를 누르지 않고 그냥 숫자를 쳐도 입력되게 */
  document.addEventListener('keydown', function(e){
    if (!lockedNow()) return;
    if (e.key === 'Enter'){ e.preventDefault(); submitPin(); return; }
    if (e.key === 'Backspace'){ e.preventDefault(); pinPress('del'); return; }
    if (/^[0-9]$/.test(e.key)){
      e.preventDefault();
      pinPress(e.key);
    }
  });
  /* 잠긴 채로 열렸다면 입력 준비 (모바일 키보드가 가리지 않도록 자동 포커스는 하지 않음) */
  setPinMsg('');
  applyLockInert();
}

/* ---------- 14. 시작 ---------- */
function boot(){
  state.ui.tab = 'home';
  initLock();
  initPager();
  renderAll();
  goToTab('home', { instant:true });
  loadWeather();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
})();
</script>
