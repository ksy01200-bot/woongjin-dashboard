<!DOCTYPE html>
<html lang="ko" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="웅진북클럽 대구중부 12지역국 일정·실적·마감·방문 관리를 한 화면에">
<meta name="robots" content="noindex, nofollow">
<title>대구중부 12지역국 업무 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BC%3C/text%3E%3C/svg%3E">
<script>
/* 이 기기에서 이미 잠금을 풀었다면, 화면이 그려지기 전에 잠금 표시를 먼저 지웁니다.
   (잠금 화면이 깜빡였다 사라지는 것을 막기 위한 한 줄) */
(function(){
  try {
    if (localStorage.getItem('woongjinDashboard.lock.v1') === '1') {
      document.documentElement.className = document.documentElement.className.replace(/\blocked\b/g, '');
    }
  } catch (e) {}
})();
</script>
<style>
:root{
  --cream:#FFFBF2; --card:#FFFFFF; --ink:#4A3B33; --ink2:#6F5F53; --muted:#A2937F;
  --line:#F1E6D6; --peach:#FFD9C0; --pink:#FFE3EC; --mint:#DCF3E8; --sky:#DFECFF; --lemon:#FFF4C9; --lav:#E9E4FF;
  --accent:#5B93A8; --accent-deep:#3F7C93; --accent-soft:#EAF4F7; --green:#7ECBA1; --green-deep:#4FA97A;
  --red:#E4695F;
  --shadow:0 10px 26px rgba(150,132,105,.13); --shadow-s:0 3px 10px rgba(150,132,105,.10);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--cream); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 6% -4%, #FFF4DD 0%, rgba(255,244,221,0) 62%),
                   radial-gradient(700px 380px at 104% 4%, #EAF4F7 0%, rgba(234,244,247,0) 60%),
                   radial-gradient(700px 420px at 50% 108%, #EFF7F1 0%, rgba(239,247,241,0) 62%);
  background-attachment:fixed;
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
  overflow:hidden; overscroll-behavior:none;
}
body.no-scroll{overflow:hidden}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none !important}

/* ---------- header ---------- */
.topbar{
  position:relative; z-index:40; flex:0 0 auto; width:100%; max-width:560px; margin:0 auto;
  display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  background:linear-gradient(180deg, rgba(255,251,242,.97) 62%, rgba(255,251,242,.75));
  backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand>div{min-width:0}
.brand .logo{font-size:24px;line-height:1;filter:drop-shadow(0 2px 3px rgba(180,140,100,.25))}
.brand h1{font-size:19px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  flex:0 0 auto; width:44px;height:44px;border-radius:16px;background:#fff;box-shadow:var(--shadow-s);
  font-size:19px;display:grid;place-items:center;transition:transform .12s;
}
.icon-btn:active{transform:scale(.94)}
@media (max-width:360px){
  .topbar{gap:8px;padding-left:13px;padding-right:13px}
  .brand .logo{font-size:21px}
  .brand h1{font-size:16.5px}
  .brand p{font-size:11px}
  .icon-btn{width:40px;height:40px;border-radius:14px;font-size:17px}
}

/* ---------- layout ---------- */
main.pager{
  position:relative; flex:1 1 auto; min-height:0; width:100%; max-width:560px; margin:0 auto;
  overflow:hidden; overscroll-behavior:none; touch-action:pan-y;
}
main.pager .track{
  display:flex; align-items:stretch; height:100%; width:100%;
  transform:translate3d(0,0,0); will-change:transform; backface-visibility:hidden;
}
main.pager .track.animating{transition:transform .34s cubic-bezier(.22,.75,.25,1)}
main.pager.dragging{cursor:grabbing}
main.pager.dragging .page,main.pager.dragging .page *{user-select:none;-webkit-user-select:none}
.page{
  flex:0 0 100%; width:100%; height:100%;
  overflow-y:auto; overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  scrollbar-width:none; -ms-overflow-style:none;
  outline:none;
}
.page::-webkit-scrollbar{display:none;width:0;height:0}
.page .who-tabs{touch-action:pan-x}
@media (prefers-reduced-motion: reduce){
  main.pager .track.animating{transition-duration:.01ms}
}
.pind{
  position:relative; z-index:39; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; gap:9px; padding:1px 0 5px;
}
.pind button{
  position:relative; width:8px; height:8px; padding:0; border:0; border-radius:999px;
  background:#E5D6C2; transition:width .28s cubic-bezier(.3,1,.4,1), background .2s, opacity .15s;
  opacity:calc(.5 + .5 * var(--k,0));
}
.pind button::after{content:'';position:absolute;inset:-8px;border-radius:999px}
.pind button.on{width:24px;background:var(--accent-deep);opacity:1}
.pind button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{
  background:var(--card); border-radius:var(--r); padding:16px 15px 14px; margin-bottom:13px;
  box-shadow:var(--shadow); border:1px solid #FFF4E6;
}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-size:17px}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.empty{font-size:13.5px;color:var(--muted);padding:12px 2px;text-align:center}
.empty.sm{padding:6px 2px;text-align:left;font-size:12.5px}
.mt8{margin-top:8px}

/* ---------- chips / who tabs ---------- */
.who-tabs{display:flex;gap:7px;margin:2px 0 12px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.who-tabs::-webkit-scrollbar{display:none}
.who-tabs.wrap{flex-wrap:wrap;overflow:visible}
.who-scroll .who-tabs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.pchips{display:flex;gap:5px;margin:2px 0 9px}
.pchip{
  flex:1 1 0;min-width:0;height:35px;padding:0 2px;border-radius:11px;background:#FBF4E9;
  font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:.15s;
}
.pchip.on{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--peach)}
.pchip:active{transform:scale(.96)}
.who{
  flex:0 0 auto; display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;
  background:#FBF4E9;border:1.5px solid transparent;transition:.16s;
}
.who .who-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#fff}
.who .who-nm{font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.who.on{background:#fff;border-color:var(--peach);box-shadow:var(--shadow-s)}
.who.on .who-nm{color:var(--ink)}

.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.av.lg{width:46px;height:46px;font-size:23px}
.av.xs{width:23px;height:23px;font-size:12px;font-style:normal;border:1.5px solid #fff}
.tk{font-size:12px;font-weight:700;background:var(--lemon);color:#8A6A2F;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tk.big{font-size:14px;padding:5px 11px}
.bar{height:10px;background:#F6EDE0;border-radius:99px;overflow:hidden}
.bar.sm{height:6px;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#BFDDE7,#8FBFD0);transition:width .4s cubic-bezier(.3,1,.4,1)}
.btn{
  min-height:46px;padding:0 18px;border-radius:15px;background:var(--accent-deep);color:#fff;
  font-size:15px;font-weight:800;box-shadow:0 6px 14px rgba(63,124,147,.26);transition:transform .12s,opacity .2s;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.ghost{background:#F4EFE5;color:var(--ink2);box-shadow:none}
.btn.danger{background:var(--red);box-shadow:0 6px 14px rgba(228,105,95,.25)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px;white-space:nowrap}
.card-h>.btn{flex:0 0 auto}
.btn.wide{width:100%;margin-top:10px}

/* ---------- weather ---------- */
.weather .w-row{display:flex;align-items:center;gap:12px}
.w-icon{font-size:38px;line-height:1;filter:drop-shadow(0 3px 4px rgba(190,150,110,.22))}
.w-main{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.w-temp{font-size:30px;font-weight:800;letter-spacing:-.03em}
.w-sky{font-size:14px;color:var(--ink2);font-weight:700}
.w-minmax{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12.5px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;background:#FBF4E9;color:var(--ink2)}
.chip.rain{background:#E4EEFF;color:#3F6499}
.chip.coat{background:#FFE9E0;color:#A55C3F}
.chip.water{background:#DFF3FF;color:#3B7A9B}
.chip.snow{background:#EDF4FF;color:#4E6E9C}
.chip.none{background:#E7F5EC;color:#4E8C6B}
.src{font-size:11.5px;color:#BBAC9B;margin-top:10px}
.weather.err .w-row{margin-bottom:4px}

/* ---------- schedules ---------- */
.s-list{display:flex;flex-direction:column}
.s-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.s-row:last-child{border-bottom:0;padding-bottom:2px}
.s-time{flex:0 0 50px;font-size:11.5px;font-weight:800;color:var(--accent-deep);text-align:right;letter-spacing:-.03em}
.s-time i{display:block;font-style:normal;white-space:nowrap}
.s-time i.end{font-size:10.5px;color:#7FA9B8;font-weight:700}
.s-time i.allday{font-size:11px;color:#B9A692}
.s-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.s-b b{font-size:14.5px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.s-b small{font-size:12px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.s-av{display:flex;gap:2px;flex:0 0 auto}
.x-btn{flex:0 0 auto;width:28px;height:28px;border-radius:9px;font-size:12.5px;color:#C1A996;display:grid;place-items:center}
.x-btn:active{background:#F7EEE2}
.tmr{margin-top:10px;font-size:12.5px;color:var(--muted);background:#FBF7EF;border-radius:12px;padding:8px 11px}
.tmr b{color:var(--ink2);margin-right:5px}
.day-h{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 6px;margin-top:6px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.day-h b{font-size:13.5px;color:var(--ink2)}
.day-block.today{background:#F6FBFC;border-radius:16px;padding:0 9px 6px;margin:6px -6px 0;box-shadow:inset 0 0 0 1.5px #DCEDF2}
.day-block.today .day-h b{color:var(--accent-deep)}
.day-block.today .day-h{border-bottom-color:#DCEDF2}

/* ---------- week / month nav ---------- */
.nav{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.nav-b{width:34px;height:34px;border-radius:11px;background:#FBF4E9;color:var(--ink2);font-size:13px;font-weight:800;display:grid;place-items:center}
.nav b{flex:1;text-align:center;font-size:14.5px;letter-spacing:-.01em}
.nav-t{height:34px;padding:0 12px;border-radius:11px;background:var(--accent-soft);color:var(--accent-deep);font-size:12.5px;font-weight:800}
.seg{display:flex;gap:7px;margin:2px 0 10px}
.seg button{flex:1;height:40px;border-radius:12px;background:#FBF4E9;font-size:13.5px;font-weight:800;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- month calendar ---------- */
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
.cal-h span{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-d{
  position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  min-height:68px;padding:4px 2px 3px;border-radius:11px;background:#FCFAF5;border:1.5px solid transparent;
  font-size:12.5px;font-weight:800;color:var(--ink2);gap:2px;overflow:hidden;
}
.cal-e{min-height:68px}
.cal-d .n{font-size:12px;font-weight:800;color:#8E7F70;line-height:1.25;text-align:center;letter-spacing:-.02em}
.cal-d.sun .n{color:#D08C7E}
.cal-d.sat .n{color:#7E9CC0}
.cal-chips{display:flex;flex-direction:column;gap:1.5px;min-width:0}
.cal-chip{
  display:block;font-size:8.5px;line-height:1.32;font-weight:800;letter-spacing:-.04em;padding:1px 2px;
  border-radius:4px;background:var(--accent-soft);color:var(--accent-deep);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.cal-chip.who{color:#6F5F53}
.cal-ow{display:flex;gap:2.5px;justify-content:center;margin-top:auto;padding-top:2px;min-height:6px}
.cal-ow i{width:5px;height:5px;border-radius:50%;display:block;transition:opacity .15s}
.cal-ow i.dim{opacity:.22}
.cal-ow .cal-more{width:auto;height:auto;border-radius:0;background:none !important;font-style:normal;font-size:8px;font-weight:800;color:#B9A692;line-height:1}
.cal-d.has{background:#fff;box-shadow:0 2px 7px rgba(150,132,105,.09)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-d.sel{border-color:var(--peach);background:#FFF8EE}
.cal-d:active{transform:scale(.96)}
@media (min-width:430px){
  .cal-d{min-height:76px}
  .cal-e{min-height:76px}
  .cal-chip{font-size:9.5px}
}
@media (max-width:360px){
  .cal-d{min-height:60px;padding:3px 1px 2px}
  .cal-e{min-height:60px}
  .cal-d .n{font-size:11px}
  .cal-chip{font-size:8px;letter-spacing:-.05em;padding:1px}
  .pchip{font-size:11.5px;height:32px}
  .dp-p{font-size:11px;padding:6px 2px;gap:2px}
  .dp-p>b{min-width:13px;padding:1px 3px}
}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:9px;font-size:11px;color:var(--muted);font-weight:700}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.cal-legend i.lg-chip{width:12px;height:7px;border-radius:3px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px #D6E7ED}
.cal-legend .lg-note{color:#C0B3A3}

/* ---------- day detail panel ---------- */
.day-panel{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);scroll-margin-top:6px}
.day-panel.flash{animation:dpIn .3s ease}
@keyframes dpIn{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
.dp-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dp-h b{font-size:15.5px}
.dp-h .dp-sub{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px}
.dp-up{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:6px 10px}
.dp-people{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 2px}
.dp-p{
  display:flex;align-items:center;justify-content:center;gap:3px;padding:7px 3px;border-radius:11px;
  background:#FBF4E9;border:1.5px solid transparent;font-size:11.5px;font-weight:800;color:var(--ink2);
  white-space:nowrap;overflow:hidden;min-width:0;transition:.15s;
}
.dp-p>span{overflow:hidden;text-overflow:ellipsis}
.dp-p>b{flex:0 0 auto;font-size:10px;font-weight:800;background:#fff;border-radius:999px;padding:1px 4px;color:var(--muted);min-width:15px;text-align:center}
.dp-p.on{background:#fff;border-color:var(--peach);box-shadow:var(--shadow-s);color:var(--ink)}
.dp-grp{margin-top:10px}
.dp-grp-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink2);padding:3px 0 4px;border-bottom:1px solid var(--line)}
.dp-grp-h>span{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
.dp-grp-h .dp-i{font-style:normal;font-size:13px}
.dp-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.dp-row:last-child{border-bottom:0;padding-bottom:3px}
.dp-t{flex:0 0 42px;text-align:right;font-size:11.5px;font-weight:800;color:var(--accent-deep);line-height:1.5;letter-spacing:-.03em}
.dp-t i{display:block;font-style:normal;white-space:nowrap}
.dp-t i.end{font-size:10.5px;color:#7FA9B8;font-weight:700}
.dp-t i.allday{font-size:10.5px;color:#B9A692}
.dp-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.dp-b b{font-size:14px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35}
.dp-b small{font-size:11.5px;color:var(--muted);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.dp-b small.dp-own{color:#A2937F;font-weight:800}
.dp-tools{display:flex;gap:1px;flex:0 0 auto;margin-top:-2px}
.dp-empty{margin-top:10px;background:#FBF7EF;border-radius:13px;padding:12px 13px;font-size:12.5px;color:var(--muted);line-height:1.55}
.dp-empty b{color:var(--ink2)}
.dp-v{border-bottom:1px dashed var(--line);padding:7px 0 3px}
.dp-v:last-child{border-bottom:0}
.dp-v-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dp-v-h b{font-size:13.5px}
.dp-v-h>span{font-size:11.5px;color:var(--muted);font-weight:700}
.dp-v-h .pill{margin-left:auto;font-size:10.5px;padding:3px 8px}

/* ---------- stats ---------- */
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:12px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink2)}
.grp-h:first-of-type{border-top:0;padding-top:0;margin-top:4px}
.grp-h small{font-size:11.5px;color:var(--muted);font-weight:700}
.grp-h i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:700;margin-left:4px}
.dday{font-size:12.5px;font-weight:800;color:#C4695E;background:#FFEDE9;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.st-row:last-child{border-bottom:0}
.st-ic{flex:0 0 auto;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:#FBF4E9}
.st-b{flex:1;min-width:0}
.st-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.st-top b{font-size:14px}
.st-pct{font-size:11.5px;font-weight:800;color:var(--accent-deep)}
.st-mid{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap}
.step{width:28px;height:28px;border-radius:9px;background:#FBF4E9;color:var(--ink2);font-size:15px;font-weight:800;display:grid;place-items:center;line-height:1}
.step:active{background:#F1E6D6}
.st-cur{font-size:17px;font-weight:800;min-width:22px;text-align:center;letter-spacing:-.02em;background:none;border:0;padding:0;color:var(--ink)}
.st-of{font-size:12px;color:var(--muted);font-weight:700}
.st-goal{font-size:12px;font-weight:800;color:var(--ink);background:none;border:0;padding:0 2px;text-decoration:underline dotted #C9B9A6;text-underline-offset:2px}
.st-left{margin-left:auto;font-size:11.5px;font-weight:800;color:#B4A492;white-space:nowrap}
.st-foot{margin-top:10px;font-size:12.5px;color:var(--muted)}
.st-foot b{color:var(--accent-deep)}

/* 구좌·진단 — 상위 담당자 실적 자동 반영 표시 */
.st-lb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.st-top .st-pct{flex:0 0 auto;white-space:nowrap}
.st-link{
  flex:0 0 auto;font-size:10px;font-weight:800;line-height:1.5;letter-spacing:-.01em;
  color:#8A6A2F;background:#FFF3D2;border-radius:999px;padding:1px 7px;white-space:nowrap;
}
.st-link-hint{
  margin-top:9px;padding:8px 10px;border-radius:12px;
  font-size:11.5px;font-weight:800;line-height:1.55;color:#94702A;
  background:#FFFAEE;box-shadow:inset 0 0 0 1.2px #F2E4C4;
}
.st-link-hint b{color:#7A5511}
@media (max-width:360px){.st-link{font-size:9.5px;padding:1px 6px}.st-link-hint{font-size:11px}}

/* All Star 실적 */
.who-tabs.st-fit{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible;padding-bottom:0}
.who-tabs.st-fit .who{padding:5px;gap:4px;min-width:0}
.who-tabs.st-fit .who .who-av{width:22px;height:22px;font-size:12px}
.who-tabs.st-fit .who .who-nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.who-tabs.st-fit .who .who-cnt{font-size:10px;padding:1px 4px;flex:0 0 auto}
@media (max-width:360px){
  .who-tabs.st-fit .who{padding:6px 3px;justify-content:center}
  .who-tabs.st-fit .who .who-av{display:none}
  .who-tabs.st-fit .who .who-nm{font-size:12px}
}
.st-who{display:flex;align-items:center;gap:9px;margin:2px 0 9px;padding:9px 11px;border-radius:15px;background:#FBF7EF}
.st-who .av{width:34px;height:34px;font-size:17px}
.st-who .w-nm{flex:1;min-width:0}
.st-who .w-nm b{display:block;font-size:14.5px;letter-spacing:-.02em}
.st-who .w-nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.st-who .tk{margin-left:auto}
.tk.gold{background:linear-gradient(135deg,#FFE9A8,#FFD166);color:#7A5211;box-shadow:0 3px 9px rgba(232,178,54,.28)}
.who .who-cnt{font-size:10.5px;font-weight:800;color:#B4A492;background:#fff;border-radius:999px;padding:1px 6px;line-height:1.5}
.who.on .who-cnt{background:#FBF4E9;color:#8E7F70}
.who .who-cnt.on{background:linear-gradient(135deg,#FFE9A8,#FFD166);color:#7A5211}
.allstar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:16px;padding:10px 12px;margin:0 0 6px;background:#FBF7EF;box-shadow:inset 0 0 0 1.5px #EFE2CE}
.as-due{
  flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;
  min-height:30px;padding:0 11px;font-size:11.5px;font-weight:800;color:#9A7326;background:#FFFDF6;
  border-radius:999px;box-shadow:inset 0 0 0 1.2px #EFDDB5;transition:transform .12s;
}
.as-due:active{transform:scale(.95)}
.as-due b{font-weight:800}
.allstar.on .as-due{background:#FFFBEA;color:#7A5211;box-shadow:inset 0 0 0 1.2px #E9C87E}
.as-due.over{color:#C4695E;background:#FFF6F4;box-shadow:inset 0 0 0 1.2px #F0C9C2}
.as-due.soon{color:#B0651F;box-shadow:inset 0 0 0 1.2px #F3CE86}
.allstar .as-ic{display:grid;place-items:center;width:20px;line-height:1}
.allstar .as-b{display:flex;flex-direction:column;gap:1px;min-width:0}
.allstar .as-b b{font-size:13.5px;letter-spacing:-.02em}
.allstar .as-b span{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.4}
.allstar.on{background:linear-gradient(135deg,#FFF7DA 0%,#FFE8A8 52%,#FFD98A 100%);box-shadow:0 8px 20px rgba(232,178,54,.26),inset 0 0 0 1.5px #F0C24E}
.allstar.on .as-ic{width:26px}
.allstar.on .as-b b{font-size:16px;color:#7A5211}
.allstar.on .as-b span{color:#9A7326}
@keyframes starPulse{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.13) rotate(7deg)}}
.as-star{width:20px;height:20px;flex:0 0 auto;fill:#DCCDB9;display:block}
.allstar.on .as-star{width:26px;height:26px;fill:#EFA92E;filter:drop-shadow(0 2px 4px rgba(170,115,20,.35));animation:starPulse 2.4s ease-in-out infinite}
.tk.gold{display:inline-flex;align-items:center;gap:4px}
.tk.gold .as-star{width:13px;height:13px;fill:#8A5A0B}
.who .who-cnt .as-star{width:12px;height:12px;fill:currentColor;display:inline-block;vertical-align:-1.5px}
.st-sub .as-star{width:12px;height:12px;fill:#E4B23C;display:inline-block;vertical-align:-2px;margin-right:2px}
.st-pct.on .as-star{width:11px;height:11px;fill:#8A5211;display:inline-block;vertical-align:-1px;margin-right:2px}
.st-num{display:flex;align-items:baseline;gap:1px;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.st-num .st-cur,.st-num .st-goal{font:inherit;color:var(--ink);border:0;background:none;padding:0 2px;border-radius:6px}
.st-num .st-cur{color:var(--accent-deep)}
.st-num .st-cur,.st-num .st-goal{text-decoration:underline dotted #C9B9A6;text-underline-offset:3px}
.st-num .st-cur:active,.st-num .st-goal:active{background:#F7EEE2}
.st-num .st-slash{color:#C9B9A6;font-size:14px;font-weight:700;padding:0 1px}
.st-num .st-unit{font-size:12px;color:var(--muted);font-weight:700;margin-left:1px}
.st-steps{display:flex;gap:5px;margin-left:auto;flex:0 0 auto}
.st-bar{height:12px;margin-top:8px;background:#F2E7D6;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(150,132,105,.10)}
.st-bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C6E0EA,#7FB6C9);transition:width .5s cubic-bezier(.3,1,.4,1)}
.st-bar.full>i{background:linear-gradient(90deg,#FFD966,#EFA93B)}
.st-bar.full{box-shadow:inset 0 0 0 1.5px #F3CE86}
.st-sub{margin-top:6px;font-size:11.5px;font-weight:800;color:#B4A492}
.st-sub.done{color:#B08228}

/* 7구좌 숙박권 — All Star(1구좌) 다음 단계 */
.st-who{flex-wrap:wrap;row-gap:6px}
.st-who .w-nm{min-width:112px}
.st-badges{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.st-badges .tk{margin-left:0}
.tk.hotel{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;background:linear-gradient(135deg,#DCF4E7,#B7E5CD);color:#2C7A55;box-shadow:0 3px 9px rgba(79,169,122,.22)}
.who .who-cnt.hotel{background:linear-gradient(135deg,#DCF4E7,#B7E5CD);color:#2C7A55}
.hotel{border-radius:16px;padding:10px 12px;margin:0 0 6px;background:#F5FAF7;box-shadow:inset 0 0 0 1.5px #DDEBE2}
.hotel .ht-h{display:flex;align-items:center;gap:7px;min-width:0}
.hotel .ht-ic{flex:0 0 auto;display:grid;place-items:center;width:20px;font-size:18px;line-height:1}
.hotel .ht-t{flex:1 1 auto;min-width:0;font-size:13.5px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hotel .ht-num{flex:0 0 auto;white-space:nowrap;font-size:12.5px;font-weight:800;color:#3E7C5E;letter-spacing:-.01em}
.hotel .ht-d{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.4;word-break:keep-all}
.hotel .ht-track{position:relative;height:12px;margin-top:9px;background:#E7F1EB;border-radius:99px;box-shadow:inset 0 1px 2px rgba(90,130,110,.12);overflow:hidden}
.hotel .ht-track>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#CDE9DA,#8AC7AA);transition:width .5s cubic-bezier(.3,1,.4,1)}
.hotel .ht-mark{position:absolute;top:0;bottom:0;width:2px;background:#E8B236;opacity:.9}
.hotel .ht-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.hotel .ht-sub{font-size:11.5px;font-weight:800;color:#9DAFA4}
.hotel .ht-stages{margin-left:auto;font-size:10.5px;font-weight:800;color:#8CA396;background:#fff;border-radius:999px;padding:2px 8px;white-space:nowrap;box-shadow:inset 0 0 0 1px #E3EEE7}
.hotel.htl-on{background:linear-gradient(135deg,#EBF9F1 0%,#D5F1E3 55%,#C4EBD8 100%);box-shadow:0 8px 20px rgba(79,169,122,.20),inset 0 0 0 1.5px #8FD0AE}
.hotel.htl-on .ht-ic{font-size:21px}
.hotel.htl-on .ht-t{font-size:15.5px;color:#2C7A55}
.hotel.htl-on .ht-d{color:#4E8A6C}
.hotel.htl-on .ht-num{color:#27714F}
.hotel.htl-on .ht-track{background:#DFF1E8;box-shadow:inset 0 0 0 1.5px #9CD8B8}
.hotel.htl-on .ht-track>i{background:linear-gradient(90deg,#7FD8AF,#3FA97A)}
.hotel.htl-on .ht-sub{color:#27714F;font-size:12px}
.hotel.htl-on .ht-stages{color:#2C7A55;background:#F3FCF7;box-shadow:inset 0 0 0 1px #BCE5CE}
/* 권명주 숙박권 — 개인 구좌 + 하이어링 두 조건 */
.kwh-conds{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kwh-cond{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:4px;padding:3px 6px 3px 8px;
  border-radius:11px;background:rgba(255,255,255,.66);box-shadow:inset 0 0 0 1px #DCEBE2}
.kwh-cond.on{background:rgba(214,242,227,.86);box-shadow:inset 0 0 0 1px #9CD8B8}
.kwh-cond-hire{flex:0 0 auto}
.kwh-lb{font-size:11.5px;font-weight:800;color:#4E7C64;white-space:nowrap;letter-spacing:-.02em}
.kwh-ctl{margin-left:auto;display:inline-flex;align-items:center;gap:1px}
.kwh-st{width:23px;height:23px;padding:0;border:0;border-radius:8px;background:#EAF5EE;color:#2C7A55;
  font:800 15px/1 inherit;display:grid;place-items:center;transition:transform .1s}
.kwh-st:active{transform:scale(.9);background:#DCF0E5}
.kwh-n{min-width:26px;height:23px;padding:0 2px;border:0;border-radius:7px;background:none;
  font-family:inherit;font-size:12.5px;font-weight:800;color:#22714E;line-height:1}
.kwh-n:active{background:#EAF5EE}
.kwh-hit{font-size:11px;font-weight:800;color:#8CA396;white-space:nowrap}
.kwh-cond.on .kwh-hit{color:#2C7A55}
.kwh-val{margin-left:auto;font-size:11.5px;font-weight:800;color:#3E7C5E;white-space:nowrap}
.kwh-cond.on .kwh-val{color:#1F7A4F}
@media (max-width:360px){.kwh-lb{font-size:11px}.kwh-val{font-size:11px}.kwh-st{width:22px;height:22px}}
@media (max-width:430px){.hotel{padding:9px 11px}.st-badges{gap:4px}}
@media (max-width:360px){.hotel .ht-t{font-size:13px}.hotel .ht-num{font-size:11.5px}.hotel .ht-d{font-size:11px}.hotel .ht-stages{display:none}}

/* ── 통합 카드: All Star + 🏨 숙박권 을 한 장으로 ──
   위(All Star)와 아래(숙박권)를 같은 판에 얹고, 얇은 구분선으로만 나눈다.
   판 색은 두 상태에 따라 달라진다: 미달성(크림) / All Star만(금) /
   숙박권만(민트) / 둘 다(금→민트). */
.starcard{position:relative;margin:0 0 6px;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#FBF7EF 0%,#FAF4EA 100%);box-shadow:inset 0 0 0 1.5px #EFE2CE;
  transition:background .32s ease,box-shadow .32s ease}
.starcard .allstar,.starcard .allstar.on,
.starcard .hotel,.starcard .hotel.htl-on{margin:0;border-radius:0;background:none;box-shadow:none}
.starcard .allstar{padding:11px 12px 10px;row-gap:4px}
.starcard .hotel{padding:9px 12px 11px;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.42) 58%,rgba(255,255,255,.60) 100%)}
.starcard .sc-div{height:2px;margin:0 12px;border-radius:2px;
  background:linear-gradient(90deg,rgba(120,100,70,0),rgba(120,100,70,.22) 12%,rgba(120,100,70,.22) 88%,rgba(120,100,70,0))}
/* 판 색 — 상태별 */
.starcard.sc-as{background:linear-gradient(135deg,#FFF7DA 0%,#FFE8A8 52%,#FFD98A 100%);
  box-shadow:0 8px 20px rgba(232,178,54,.26),inset 0 0 0 1.5px #F0C24E}
.starcard.sc-ht{background:linear-gradient(135deg,#EBF9F1 0%,#D5F1E3 55%,#C4EBD8 100%);
  box-shadow:0 8px 20px rgba(79,169,122,.20),inset 0 0 0 1.5px #8FD0AE}
.starcard.sc-as.sc-ht{background:linear-gradient(158deg,#FFF8DF 0%,#FFE9AE 36%,#E7F7EC 66%,#C9EEDA 100%);
  box-shadow:0 9px 22px rgba(150,165,95,.22),inset 0 0 0 1.5px #D9D8A0}
.starcard.sc-as .sc-div{background:linear-gradient(90deg,rgba(200,150,40,0),rgba(200,150,40,.42) 12%,rgba(200,150,40,.42) 88%,rgba(200,150,40,0))}
.starcard.sc-ht .sc-div{background:linear-gradient(90deg,rgba(60,140,105,0),rgba(60,140,105,.34) 12%,rgba(60,140,105,.34) 88%,rgba(60,140,105,0))}
.starcard.sc-as.sc-ht .sc-div{background:linear-gradient(90deg,rgba(200,150,40,0),rgba(200,150,40,.46) 22%,rgba(60,140,105,.40) 78%,rgba(60,140,105,0))}
/* 금색 판 위의 숙박권 줄 — 회색 글씨가 묻히지 않게 */
.starcard.sc-as .hotel.htl-off .ht-num{color:#2F7452}
.starcard.sc-as .hotel.htl-off .ht-d{color:#8A6A2F}
.starcard.sc-as .hotel.htl-off .ht-sub{color:#8C7440}
.starcard.sc-as .hotel.htl-off .ht-stages{color:#8A6A2F;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(214,180,112,.65)}
.starcard.sc-as .hotel.htl-off .ht-track{background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(225,196,138,.75)}
/* 민트 판 위의 All Star 줄 */
.starcard.sc-ht .allstar .as-b span{color:#6E8A7C}
.starcard.sc-ht .allstar .as-due{background:rgba(255,255,255,.78)}
.starcard.sc-ht .hotel.htl-on .ht-t{color:#1F6B49}
.starcard.sc-ht .hotel.htl-on .ht-num{color:#1B6444}
.starcard.sc-ht .hotel.htl-on .ht-sub{color:#1B6444}
.starcard.sc-ht .hotel.htl-on .ht-track{box-shadow:inset 0 0 0 1.5px #7FC7A2}
@media (max-width:430px){.starcard .allstar{padding:10px 11px 9px}.starcard .hotel{padding:8px 11px 10px}.starcard .sc-div{margin:0 11px}}
@media (max-width:360px){.starcard{border-radius:16px}.starcard .allstar{padding:9px 10px 8px}.starcard .hotel{padding:8px 10px 9px}.starcard .sc-div{margin:0 10px}}

/* 독서케어 — 총 케어 인원 대비 비율형 */
.st-row.ratio .st-ic{background:#FFF1DC;box-shadow:inset 0 0 0 1.5px #F4DDB6}
.rt-line{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.rt-total{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.rt-lbl{font-size:11.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.rt-line .step{width:27px;height:27px;border-radius:9px;font-size:14px}
.rt-num{
  width:46px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#FFFDF8;
  text-align:center;font-size:15px;font-weight:800;color:var(--ink);padding:0 2px;
  appearance:textfield;-webkit-appearance:none;-moz-appearance:textfield;
}
.rt-num::-webkit-outer-spin-button,.rt-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rt-num:focus{outline:none;border-color:var(--peach);background:#fff;box-shadow:0 0 0 3px rgba(255,217,192,.35)}
.rt-total .rt-num{width:56px}
.rt-u{font-size:11.5px;color:var(--muted);font-weight:700}
.st-pct.muted{color:#B4A492;background:none}
.ratio-hint{margin-top:8px;font-size:11.5px;color:#B4A492;font-weight:800;line-height:1.5}
.ratio-hint b{color:var(--accent-deep)}
.hint-mini{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.55;margin-top:9px}
.st-row.done .st-ic{background:#FFF1C9;box-shadow:inset 0 0 0 1.5px #F3D681}
.st-pct.on{background:linear-gradient(135deg,#FFE8A3,#FFD166);color:#7A5211;border-radius:999px;padding:2px 8px}
@media (prefers-reduced-motion: reduce){.allstar.on .as-star{animation:none}}
.empty-guide{background:#FBF7EF;border-radius:14px;padding:13px 14px;text-align:center;margin:6px 0 4px}
.empty-guide b{font-size:14px}
.empty-guide p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.55}

/* ---------- todo rows ---------- */
.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:0}
.ck{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid #E7D9C7;background:#FFFDF8;
  display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;transition:.15s;
}
.ck.on{background:var(--green);border-color:var(--green);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1);opacity:1}}
.r-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r-b b{font-size:14.5px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.r-b small{font-size:11.5px;color:var(--muted)}
.row.on .r-b b{color:#B7A896;text-decoration:line-through;text-decoration-thickness:1.5px}
.t-btn{width:28px;height:28px;border-radius:9px;font-size:13px;display:grid;place-items:center;opacity:.55;flex:0 0 auto}
.t-btn:active{background:#F7EEE2;opacity:1}
.t-btn.del{color:#D08C7E}
.add-inline{display:flex;gap:6px;margin-top:11px}
.add-inline input{
  flex:1;min-width:0;height:44px;border-radius:13px;border:1.5px solid var(--line);
  background:#FFFDF8;padding:0 12px;font-size:15px;
}
.add-inline input:focus{outline:none;border-color:var(--peach);background:#fff}
.mini-sel{height:44px;border-radius:13px;border:1.5px solid var(--line);background:#FFFDF8;padding:0 8px;font-size:13px;font-weight:700;color:var(--ink2);max-width:96px}

/* ---------- deadline ---------- */
.dl-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line)}
.dl-row:last-child{border-bottom:0}
.dl-b{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.dl-b b{font-size:14.5px;word-break:keep-all;overflow-wrap:anywhere}
.dl-b small{font-size:11.5px;color:var(--muted)}
.dl-row.on .dl-b b{color:#B7A896;text-decoration:line-through}
.dd{font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 7px;background:#F4EFE5;color:#8E7F70;white-space:nowrap}
.dd.now{background:#FFEDE9;color:#C4695E}
.dd.past{background:#F2F2F0;color:#B6ADA2}

.v-b b{font-size:15px}

.v-memo{font-size:12.5px;color:var(--ink2);background:#FBF7EF;border-radius:11px;padding:7px 10px;margin-top:8px;white-space:pre-wrap}

}

/* ---------- modal ---------- */

}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}

/* ---------- toast / fx ---------- */

#fx{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.float-coin{

}
@keyframes coinUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.celebrate{

.celebrate .cel-emoji{font-size:50px;line-height:1.1;animation:wob .6s ease}
.celebrate b{font-size:17px}
.celebrate span{font-size:13px;color:var(--muted);font-weight:700}
.celebrate.out{opacity:0;transform:translate(-50%,-50%) scale(.9);transition:.35s}
@keyframes popBig{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg) scale(1.06)}}
.confetti{position:absolute;top:-24px;animation:fall 2.1s linear forwards;font-size:18px}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(320deg);opacity:.9}}
/* ---------- 잠금 화면 (업무 비밀번호 4자리) ---------- */
html.locked .topbar,html.locked .pind,html.locked #pager,html.locked .tabbar{visibility:hidden}
.lock-screen{display:none}
html.locked .lock-screen{
  display:flex; position:fixed; inset:0; z-index:300;
  align-items:center; justify-content:center;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));

  background-image:radial-gradient(900px 420px at 6% -4%, #FFF4DD 0%, rgba(255,244,221,0) 62%),
                   radial-gradient(700px 380px at 104% 4%, #EAF4F7 0%, rgba(234,244,247,0) 60%),
                   radial-gradient(700px 420px at 50% 108%, #EFF7F1 0%, rgba(239,247,241,0) 62%);

}
.lock-card{width:100%; max-width:320px; margin:auto; text-align:center}
.lock-card.shake{animation:lockShake .36s cubic-bezier(.36,.07,.19,.97)}
@keyframes lockShake{

}
.lock-logo{font-size:46px; line-height:1.1; filter:drop-shadow(0 4px 8px rgba(150,132,105,.22))}
.lock-card h2{font-size:19px; margin-top:10px; letter-spacing:-.03em}
.lock-sub{font-size:13px; color:var(--muted); margin-top:4px; font-weight:700}
.pin-input{
  width:100%; height:62px; margin-top:18px; padding:0 0 0 12px;
  text-align:center; font-size:30px; font-weight:800; line-height:1; letter-spacing:12px;

.pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:4px}
.pin-pad button{

}

@media (max-height:620px){

  .lock-tip{display:none}
}
</style>
</head>
<body>

<!-- 잠금 화면: 비밀번호를 풀기 전까지 대시보드 내용을 완전히 가립니다 -->
<div class="lock-screen" id="lockScreen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">

</div>

 </div>

<script>
(function(){
'use strict';
/* =========================================================
   대구중부 12지역국 업무 대시보드 — 단일 파일 앱
   모든 기록은 이 브라우저의 localStorage 에만 저장됩니다.
   ========================================================= */

/* ---------- 1. 상수 ---------- */
var STORAGE_KEY = 'woongjin12Dashboard.v1';
var WEATHER_KEY = 'woongjin12Dashboard.weather.v1';
var SEED_VERSION = 3;
var REGION_NAME = '대구중부 12지역국';
var MY_DEADLINE = '2026-11-24';
var MY_ID = 'soyeon';
var TAB_ORDER = ['home','schedule','work','visit'];
var WD = ['일','월','화','수','목','금','토'];

var OWNERS = [
  { id:'common',  name:'지역국 공통', short:'지역국 공통', emoji:'🏢', color:'#E4EEF7', dot:'#8FB6CF' },
  { id:'ima',     name:'이미화 국장님', short:'이미화', emoji:'👑', color:'#FFE1EA', dot:'#E39AB0' },
  { id:'kwon',    name:'권명주 팀장님', short:'권명주', emoji:'🎯', color:'#E7E3FF', dot:'#A79BE0' },
  { id:'soyeon',  name:'김소연 님', short:'김소연', emoji:'🌸', color:'#FFE3D3', dot:'#E9A47F' }
];
var FILTERS = [
  { id:'all',     name:'전체',       emoji:'🗂️' },
  { id:'common',  name:'지역국 공통', emoji:'🏢' },
  { id:'ima',     name:'이미화',      emoji:'👑' },
  { id:'kwon',    name:'권명주',      emoji:'🎯' },
  { id:'soyeon',  name:'김소연',      emoji:'🌸' }
];
/* 홈 '담당자별 할 일·메모'는 담당자 탭만 (전체 없음) */
var TASK_FILTERS = FILTERS.filter(function(o){ return o.id !== 'all'; });
var TASK_OWNER_DEFAULT = 'soyeon';
function isOwnerId(id){
  for (var i=0;i<OWNERS.length;i++){ if (OWNERS[i].id === id) return true; }
  return false;
}

/* ---------- 2. 유틸 ---------- */
var TODAY_OVERRIDE = (function(){
  try {
    if (window.__TODAY__) return String(window.__TODAY__);
    var m = location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : null;
  } catch(e){ return null; }
})();

function pad2(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseYmd(s){ var p=String(s).split('-'); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
function nowDate(){ return TODAY_OVERRIDE ? parseYmd(TODAY_OVERRIDE) : new Date(); }
function today(){ return ymd(nowDate()); }
function shiftDate(s, n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function wdIdx(d){ return (d.getDay()+6)%7+1; }
function kdate(s){ var d=parseYmd(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function mdLabel(s){ var d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function daysBetween(a,b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function ownerById(id){ for (var i=0;i<OWNERS.length;i++){ if (OWNERS[i].id===id) return OWNERS[i]; } return OWNERS[0]; }
function ownerEmoji(id){ return ownerById(id).emoji; }
function ddayLabel(){
  var n = daysBetween(today(), MY_DEADLINE);
  if (n > 0) return 'D-'+n;
  if (n === 0) return 'D-DAY';
  return 'D+'+(0-n);
}
function ddChip(date){
  var n = daysBetween(today(), date);
  if (n > 0) return '<span class="dd">D-'+n+'</span>';
  if (n === 0) return '<span class="dd now">D-DAY</span>';
  return '<span class="dd past">D+'+(0-n)+'</span>';
}
function byStart(a,b){
  var x = a.start || '99:99', y = b.start || '99:99';
  if (x !== y) return x < y ? -1 : 1;
  return a.title < b.title ? -1 : 1;
}

/* ---------- 3. 시드 데이터 ---------- */
/* 출처: schedules/woongjin-12-2026-11.md + schedules/2026-11.md */

/* ---------- 4. 저장 / 불러오기 ---------- */
/* 일반 실적 수치는 소수 둘째 자리까지 (예: 0.5 · 1.2 · 35.5).

function roundQty(v){
  var n = Number(v);
  if (!isFinite(n)) return 0;
  n = Math.round(n * 100) / 100;
  if (n < 0) n = 0;
  if (n > QTY_LIMIT) n = QTY_LIMIT;
  return n;
}
/* 빈칸·글자는 NaN 으로 돌려준다 (폼 검증용) */
function parseQty(v){
  if (v === null || v === undefined) return NaN;
  if (String(v).trim() === '') return NaN;
  var n = Number(v);
  if (!isFinite(n)) return NaN;
  return roundQty(n);
}
function clampQty(v){ var n = parseQty(v); return isNaN(n) ? 0 : n; }
/* 사람 수(인원)는 정수만 — 독서케어 완료·총 케어 인원 */
function clampPeople(v){
  var n = Math.round(Number(v) || 0);
  if (!isFinite(n)) n = 0;
  if (n < 0) n = 0;
  if (n > QTY_LIMIT) n = QTY_LIMIT;
  return n;
}
/* 화면 표기: 정수는 소수점 없이(1 / 1구좌, 8 / 10회),
   소수는 둘째 자리까지 깔끔하게(0.5 · 1.2 · 35.5) */
function fmtNum(v){
  var n = Number(v);
  if (!isFinite(n)) return '0';
  n = Math.round(n * 100) / 100;
  if (n % 1 === 0) return String(Math.round(n));
  return n.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
}
function cleanStatItems(arr){
  return (Array.isArray(arr) ? arr : []).map(function(it){
    it = it || {};
    var out = {
      id: it.id || uid('st'),
      label: String(it.label || '실적').slice(0,30),
      emoji: String(it.emoji || '📌').slice(0,3),
      goal: Math.min(QTY_LIMIT, Math.max(1, roundQty(it.goal) || 10)),
      cur: clampQty(it.cur),
      unit: String(it.unit || '').slice(0,4)
    };
    /* 비율형(독서케어): 목표는 90% 고정, 총 케어 인원(total)과 완료 인원(cur)을 함께 저장 */
    if (it.type === 'ratio') {
      out.type = 'ratio';
      out.goal = RATIO_GOAL;
      out.cur = clampPeople(it.cur);
      out.total = clampPeople(it.total);
      out.unit = out.unit || '%';
    }
    return out;
  });
}
/* 예전 % 입력 항목(독서케어)을 인원 기준 비율형으로 옮긴다 */
function migrateRatioItems(stats){
  ['ima','kwon','soyeon'].forEach(function(k){
    (stats[k] || []).forEach(function(it){
      if (!it || it.type === 'ratio') return;
      if (it.id === 'st_ima_read' || /독서\s*케어/.test(String(it.label || ''))) {
        it.type = 'ratio';
        it.goal = RATIO_GOAL;
        it.total = clampPeople(it.total);
        it.cur = 0;      /* 예전 % 값은 인원 기준이 없어 인원 카운트로 옮길 수 없음 */
        it.unit = '%';

}
/* 시드 v3: 강다혜 방문 11/18(수) 16:30 → 11/20(금) 16:30 (소연 님 요청).
   사용자가 넣은 실적·완료 체크는 그대로 두고 날짜만 옮긴다.

function legacyStatsShape(s){
  if (!s || typeof s !== 'object') return true;

/* 새 세팅으로 바꾸면서, 같은 id 의 예전 현재값은 이어받기 */
function carryStatCur(next, old){
  var prev = {};
  ['ima','kwon','soyeon'].forEach(function(k){
    (Array.isArray(old[k]) ? old[k] : []).forEach(function(it){
      if (it && it.id) prev[it.id] = Number(it.cur) || 0;
    });
  });
  ['ima','kwon','soyeon'].forEach(function(k){
    next[k].forEach(function(it){

function normalize(src){
  var d = defaultState();

  /* 개인별 실적: All Star 세팅으로 1회 마이그레이션 (직접 만든 항목은 지키기) */

  }

  /* 세팅 버전이 올라올 때 한 번만: 독서케어를 총 인원 기준 비율형으로 */
  if (setupVer < STATS_SETUP_VERSION) migrateRatioItems(out.stats);

  if (!Array.isArray(out.schedules)) out.schedules = d.schedules;
  if (!Array.isArray(out.deadlines)) out.deadlines = d.deadlines;
  if (!Array.isArray(out.notices)) out.notices = d.notices;
  if (!Array.isArray(out.visits)) out.visits = d.visits;
  if (!Array.isArray(out.tasks)) out.tasks = d.tasks;

  out.schedules.forEach(function(s){
    if (!s.id) s.id = uid('sc');
    if (s.kind !== 'weekly' && s.kind !== 'date') s.kind = s.date ? 'date' : 'weekly';
    if (s.kind === 'weekly') { s.day = Number(s.day) || 1; s.date = null; }
    else { s.date = s.date || today(); s.endDate = s.endDate || null; }
    if (!s.owner) s.owner = 'common';

  });
  out.deadlines.forEach(function(x){
    if (!x.id) x.id = uid('dl');

    if (!x.date) x.date = today();
    x.done = !!x.done;
  });
  out.notices.forEach(function(n){
    if (!n.id) n.id = uid('nt');
    n.pinned = !!n.pinned;
  });
  out.visits.forEach(function(v){
    if (!v.id) v.id = uid('vi');
    if (!v.owner) v.owner = 'soyeon';
    if (!Array.isArray(v.checklist)) v.checklist = [];
    v.checklist.forEach(function(c){ if (!c.id) c.id = uid('vic'); c.done = !!c.done; });
    v.done = !!v.done;
  });
  out.tasks.forEach(function(t){ if (!t.id) t.id = uid('tk'); t.done = !!t.done; if (!t.owner) t.owner='common'; });

  /* 예전 버전(주간 기본)에서 올라오면 한 번만 달력형으로 바꿔 준다 */

}

function load(){

}

/* ---------- 5. 계산 ---------- */
function ownerMatch(o, filter){ return !filter || filter === 'all' || o === filter; }

function schedulesForDate(ds){

}

/* 달력 칸에 보일 짧은 이름 */
function autoShort(title){
  var s = String(title || '');
  s = s.replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' ');
  s = s.replace(/^(본부|지역국|사업국|본사|경북|교육국장님)\s*/, '');
  s = s.replace(/에듀\s*맘\s*DAY/ig, '에듀맘');
  s = s.replace(/SMART\s*EDU\s*(\d)\s*과정/ig, 'EDU$1');
  s = s.replace(/\s+/g, '').replace(/[·・|\/,]/g, '');
  if (s.length > 5) s = s.slice(0, 5);

}
function chipLabel(s){ return (s && s.short) ? String(s.short) : autoShort(s && s.title); }
function normTitle(t){
  return String(t || '').replace(/[\s·・,.\-–_()\[\]]/g, '').replace(/마감일$/, '마감');
}
/* 그날 마감 목록 중, 같은 날 일정으로 이미 보이는 것은 빼고 */
function dayDeadlines(ds){

  return state.deadlines.filter(function(d){
    if (d.date !== ds) return false;
    var k = normTitle(d.title);
    for (var i=0;i<keys.length;i++){
      if (keys[i] === k) return false;

}

    .sort(function(a,b){

}
/* 같은 날 같은 사람의 방문 카드와 짝을 이루는 일정인가 (제목에 고객 이름) */

/* ---------- 5a. 7구좌 숙박권 — All Star(구좌 1) 다음 단계 ----------

/* ---------- 5a-2. 권명주 숙박권 — 개인 3구좌 + 하이어링 1명 ----------

/* ---------- 5b. 구좌·진단 — 위 담당자 실적에 변동분(Δ)만 더하기 ----------
   구좌: 김소연 → 권명주(팀 구좌) → 이미화(월 구좌)
   진단: 김소연 → 권명주(팀 진단)
   이미 저장돼 있던 숫자는 다시 계산하지 않는다. 앞으로 ＋/− 나 직접 입력으로
   바뀔 때의 변동분(Δ)만 위 담당자 실적에 같은 만큼 더한다(소수 둘째 자리, 0 이상). */
var STAT_CHAIN = [
  { key:'gujwa', label:'구좌', slots:[
    { owner:'soyeon', id:'st_so_gujwa',   label:'구좌' },
    { owner:'kwon',   id:'st_kwon_gujwa', label:'팀 구좌' },
    { owner:'ima',    id:'st_ima_gujwa',  label:'월 구좌' }
  ] },
  { key:'diag', label:'팀 진단', slots:[
    { owner:'soyeon', id:'st_diag',      label:'진단' },
    { owner:'kwon',   id:'st_kwon_diag', label:'팀 진단' }
  ] }
];
/* 변동분은 음수도 되므로 roundQty(0 미만 → 0) 대신 부호를 살린 반올림을 쓴다 */
function roundDelta(v){
  var n = Number(v);
  if (!isFinite(n)) return 0;
  return Math.round(n * 100) / 100;
}
/* 항목은 id 로 찾고, 지웠다 새로 만든 경우에만 같은 담당자 안에서 이름으로 찾는다 */
function resolveStatSlot(ownerId, slot){
  var items = statsOf(ownerId);
  for (var i=0;i<items.length;i++){ if (items[i].id === slot.id) return items[i]; }
  var exact = null, partial = null, n = 0;
  for (i=0;i<items.length;i++){
    var lb = String(items[i].label || '').replace(/\s+/g,' ').trim();
    if (lb === slot.label){ exact = items[i]; break; }
    if (lb.indexOf(slot.label) >= 0){ partial = items[i]; n++; }
  }
  if (exact) return exact;
  return n === 1 ? partial : null;
}
/* 이 항목이 어느 연동 줄의 몇 번째 칸인지 */
function statChainHit(ownerId, itemId){
  var i, j, ch, sl;
  for (i=0;i<STAT_CHAIN.length;i++){
    ch = STAT_CHAIN[i];
    for (j=0;j<ch.slots.length;j++){
      sl = ch.slots[j];
      if (sl.owner === ownerId && sl.id === itemId) return { chain:ch, idx:j };
    }
  }
  for (i=0;i<STAT_CHAIN.length;i++){
    ch = STAT_CHAIN[i];
    for (j=0;j<ch.slots.length;j++){
      sl = ch.slots[j];
      if (sl.owner !== ownerId) continue;
      var it = resolveStatSlot(ownerId, sl);
      if (it && it.id === itemId) return { chain:ch, idx:j };
    }
  }
  return null;
}
/* 이 항목보다 위에 있는 담당자 칸들 */
function statChainAbove(ownerId, itemId){
  var hit = statChainHit(ownerId, itemId);
  if (!hit) return null;
  var above = hit.chain.slots.slice(hit.idx + 1);
  if (!above.length) return null;
  return { chain:hit.chain, idx:hit.idx, above:above };
}
/* 위 담당자 실적에 Δ 를 더한다 — 실제로 바뀐 칸만 돌려준다 */
function addStatDelta(ownerId, itemId, delta){
  if (!delta) return null;
  var lk = statChainAbove(ownerId, itemId);
  if (!lk) return null;
  var applied = [];
  lk.above.forEach(function(slot){
    var it = resolveStatSlot(slot.owner, slot);
    if (!it) return;
    var before = statCur(it);
    var starBefore = allStarOf(slot.owner).on;
    var next = statIsRatio(it) ? clampPeople(before + delta) : roundQty(before + delta);
    if (next === before) return;
    it.cur = next;
    applied.push({
      owner: slot.owner, short: ownerById(slot.owner).short, label: it.label,
      before: before, after: next, delta: roundDelta(next - before),
      starBefore: starBefore, starNow: allStarOf(slot.owner).on
    });
  });
  if (!applied.length) return null;
  var src = null, items = statsOf(ownerId);
  for (var i=0;i<items.length;i++){ if (items[i].id === itemId) src = items[i]; }
  return {
    chain: lk.chain, delta: roundDelta(delta),
    fromOwner: ownerId, fromShort: ownerById(ownerId).short,
    fromLabel: (src ? src.label : lk.chain.label), applied: applied
  };
}
/* 실적 현재값을 바꾸는 유일한 통로 — 바뀐 변동분을 위 담당자에도 함께 더한다 */
function setStatCur(ownerId, itemId, value){
  var items = statsOf(ownerId), it = null;
  for (var i=0;i<items.length;i++){ if (items[i].id === itemId) it = items[i]; }
  if (!it) return null;
  var before = statCur(it);
  var next = statIsRatio(it) ? clampPeople(value) : roundQty(value);
  if (next === before) return { item:it, before:before, after:before, delta:0, link:null };
  it.cur = next;
  var delta = roundDelta(next - before);
  return { item:it, before:before, after:next, delta:delta, link:addStatDelta(ownerId, itemId, delta) };
}
/* 연동해서 함께 바뀌었을 때 짧게 알려 준다 */
function statLinkNotice(res){
  if (!res || !res.link) return false;
  var lk = res.link;

/* 비율형(독서케어) — 완료 / 총 케어 인원, 90% 목표 기준 진행 바 */
function ratioView(it){
  var cur = statCur(it);
  var total = statTotal(it);
  var pct = ratioPct(it);
  var done = pct !== null && pct >= RATIO_GOAL;
  var barPct = pct === null ? 0 : Math.min(100, Math.round(pct / RATIO_GOAL * 100));
  var sub;
  if (pct === null) {
    sub = '총 케어 인원을 입력해 주세요';
  } else if (done) {
    sub = starIcon()+'목표 달성 ('+ratioPctText(pct)+')';
    if (cur > total) sub += ' · 총 인원보다 +'+(cur-total)+'명';
  } else {
    var need = Math.ceil(total * RATIO_GOAL / 100) - cur;
    if (need < 1) need = 1;
    sub = RATIO_GOAL+'%까지 '+need+'명 남음';
  }
  return { cur:cur, total:total, pct:pct, done:done, barPct:barPct, sub:sub };
}

/* 타이핑 중에도 달성률·바·안내만 다시 그린다 (입력칸·커서·키보드는 그대로) */
function refreshRatioRow(it){
  if (!statIsRatio(it)) return;
  var totEl = document.querySelector('[data-act="statRatioTotal"][data-id="'+it.id+'"]');
  var row = totEl ? totEl.closest('.st-row') : null;
  if (!row) return;
  var v = ratioView(it);
  row.classList.toggle('done', v.done);
  var badge = row.querySelector('[data-role="ratioPct"]');
  if (badge) {
    badge.className = 'st-pct' + (v.done ? ' on' : (v.pct === null ? ' muted' : ''));
    badge.innerHTML = (v.done ? starIcon() : '') + ratioPctText(v.pct);
  }
  var bar = row.querySelector('.st-bar');
  if (bar) {
    if (v.done) bar.classList.add('full'); else bar.classList.remove('full');
    var fill = bar.querySelector('i');
    if (fill) fill.style.width = v.barPct + '%';
  }
  var sub = row.querySelector('.st-sub');
  if (sub) {
    sub.className = 'st-sub' + (v.done ? ' done' : '');
    sub.innerHTML = v.sub;
  }
}

/* 화면 인원 입력칸에 타이핑만 하고 아직 빠져나오지 않은 값도 함께 맞춰 준다 */
function syncRatioFromDom(it){
  if (!statIsRatio(it)) return false;
  var changed = false;
  var curEl = document.querySelector('[data-act="statRatioCur"][data-id="'+it.id+'"]');
  var totEl = document.querySelector('[data-act="statRatioTotal"][data-id="'+it.id+'"]');
  if (curEl) {
    var c = clampPeople(curEl.value);
    if (c !== statCur(it)) { it.cur = c; changed = true; }
  }
  if (totEl) {
    var t2 = clampPeople(totEl.value);
    if (t2 !== statTotal(it)) { it.total = t2; changed = true; }
  }
  if (changed) save();
  return changed;
}

function starIcon(){
  return '<svg class="as-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
    + '<path d="M12 2.3l3 6.02 6.64.96-4.8 4.68 1.13 6.61L12 17.45l-5.97 3.12 1.14-6.61-4.8-4.68 6.64-.96z"/>'
    + '</svg>';
}

/* 이번 달 All Star 달성 기한 (저장값이 깨졌으면 기본값) */
function allStarDue(){
  var d = String((state && state.allStarDue) || '');
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : ALLSTAR_DUE_DEFAULT;
}
function dueDday(date){
  var n = daysBetween(today(), date);
  if (n > 0) return 'D-'+n;
  if (n === 0) return 'D-DAY';
  return '마감 지남';
}
function dueChip(on){
  var due = allStarDue();
  var n = daysBetween(today(), due);
  var cls = 'as-due' + (n < 0 ? ' over' : (n <= 3 ? ' soon' : ''));
  return '<button class="'+cls+'" data-act="allStarDue" aria-label="올스타 달성 기한 바꾸기 (지금 '+esc(mdLabel(due))+' '+dueDday(due)+')">'
    + '⏳ 마감 '+mdLabel(due)+' · '+dueDday(due) + '</button>';
}

function allStarBanner(ownerId){
  var a = allStarOf(ownerId);
  if (!a.total) return '';
  var chip = dueChip(a.on);
  if (a.on) {
    return '<div class="allstar on">'
      + '<span class="as-ic">'+starIcon()+'</span>'
      + '<div class="as-b"><b>All Star 달성!</b>'
      +   '<span>항목 '+a.total+'개 모두 목표 이상 · 넘긴 실적도 그대로 쌓여요</span></div>'
      + chip
      + '</div>';
  }
  return '<div class="allstar">'
    + '<span class="as-ic">'+starIcon()+'</span>'
    + '<div class="as-b"><b>All Star까지 '+a.left+'개 항목 남음</b>'
    +   '<span>'+a.done+' / '+a.total+' 달성 · 모든 항목이 목표 이상이면 All Star</span></div>'
    + chip
    + '</div>';
}

function hotelBanner(ownerId){
  if (ownerId === KWON_OWNER) return kwonHotelBanner();
  if (ownerId !== HOTEL_OWNER) return '';
  var v = hotelView();
  if (!v) return '';
  var markPct = Math.round(1 / HOTEL_GOAL * 1000) / 10;   /* All Star 1구좌 기준선 */
  var desc = v.done
    ? HOTEL_GOAL + '구좌 달성 · 넘긴 구좌도 그대로 쌓여요'
    : 'All Star 다음 단계 · 구좌 ' + HOTEL_GOAL + '개를 채우면 숙박권 달성';
  return '<div class="hotel htl-'+(v.done?'on':'off')+'" id="hotelStage">'
    + '<div class="ht-h">'
    +   '<span class="ht-ic" aria-hidden="true">🏨</span>'
    +   '<b class="ht-t">7구좌 숙박권</b>'
    +   '<span class="ht-num" data-role="htNum">'+fmtNum(v.cur)+' / '+HOTEL_GOAL+'구좌</span>'
    + '</div>'
    + '<p class="ht-d">'+esc(desc)+'</p>'
    + '<div class="ht-track" role="progressbar" aria-label="숙박권 진행" aria-valuemin="0" aria-valuemax="'+HOTEL_GOAL+'" aria-valuenow="'+v.cur+'">'
    +   '<i data-role="htFill" style="width:'+v.pct+'%"></i>'
    +   '<span class="ht-mark" style="left:'+markPct+'%" title="All Star 1구좌" aria-hidden="true"></span>'
    + '</div>'
    + '<div class="ht-foot"><span class="ht-sub" data-role="htSub">'+esc(v.sub)+'</span>'
    +   '<span class="ht-stages">All Star 1 · 🏨 '+HOTEL_GOAL+'</span></div>'
    + '</div>';
}

function statTabsHtml(who){
  return ['ima','kwon','soyeon'].map(function(id){
    var m = ownerById(id);
    var a = allStarOf(id);
    var hv = id === HOTEL_OWNER ? hotelView() : (id === KWON_OWNER ? kwonHotelView() : null);
    var cnt = a.total ? (a.on ? starIcon() : a.done+'/'+a.total) : '';
    /* 숙박권을 달성했으면 탭에는 🏨 만 — 좁은 화면에서 이름이 잘리지 않게 */
    var badge = (hv && hv.done)
      ? '<b class="who-cnt hotel" title="숙박권 달성">🏨</b>'
      : (cnt ? '<b class="who-cnt'+(a.on?' on':'')+'">'+cnt+'</b>' : '');
    return '<button class="who'+(who===id?' on':'')+'" data-act="filter" data-kind="stat" data-owner="'+id+'">'
      + '<span class="who-av" style="background:'+m.color+'">'+m.emoji+'</span>'
      + '<span class="who-nm">'+esc(m.short)+'</span>'
      + badge
      + '</button>';
  }).join('');
}

function statSummaryHtml(who){
  var me = ownerById(who);
  var mine = allStarOf(who);
  var hv = who === HOTEL_OWNER ? hotelView() : (who === KWON_OWNER ? kwonHotelView() : null);
  var badges = '';
  if (mine.on) badges += '<span class="tk gold">'+starIcon()+'All Star</span>';
  if (hv && hv.done) badges += '<span class="tk hotel">🏨 숙박권 달성</span>';
  /* All Star 조건바와 숙박권 진행 바는 한 장의 카드로 묶는다.
     판 색은 네 가지 조합(미달성 / All Star만 / 숙박권만 / 둘 다)에 맞춰 달라진다. */
  var asHtml = allStarBanner(who);
  var htHtml = hotelBanner(who);
  var stage;
  if (asHtml && htHtml) {
    var scCls = 'starcard' + (mine.on ? ' sc-as' : '') + (hv.done ? ' sc-ht' : '');
    var scState = (mine.on && hv.done) ? 'both' : (mine.on ? 'as' : (hv.done ? 'hotel' : 'none'));
    stage = '<div class="'+scCls+'" id="starCard" data-state="'+scState+'">'
      + asHtml
      + '<div class="sc-div" role="separator" aria-hidden="true"></div>'
      + htHtml
      + '</div>';
  } else {
    stage = asHtml + htHtml;
  }
  return '<div class="st-who">'
    + '<span class="av" style="background:'+me.color+'">'+me.emoji+'</span>'
    + '<div class="w-nm"><b>'+esc(me.name)+'</b>'
    +   '<small>'+mine.done+' / '+mine.total+' 항목 달성</small></div>'
    + (badges ? '<div class="st-badges">'+badges+'</div>' : '')
    + '</div>'
    + stage;
}

function statFootHtml(who){
  var items = statsOf(who);
  var mine = allStarOf(who);
  return (items.some(statIsRatio)
      ? '<p class="ratio-hint">📖 <b>독서케어</b>는 매달 초에 <b>총 케어 인원</b>을 넣으면 (완료 ÷ 총) 90% 달성을 자동으로 확인해요.</p>'
      : '')
    + '<p class="st-foot">'+(mine.left > 0
        ? '<b>'+mine.done+' / '+mine.total+'</b> 항목 달성 · − ＋ 로 계속 세고, 숫자를 누르면 직접 고칠 수 있어요'
        : '이 달 실적 항목을 모두 채웠어요 🎉')+'</p>'
    + statLinkHintHtml(who);
}

/* 인원 입력칸에서 빠져나올 때: 실적 행(입력칸·− ＋)은 그대로 두고
   머리말·All Star 조건바·탭 표시만 다시 그린다 (누르던 버튼이 사라지지 않게) */
function refreshStatsChrome(ownerId){
  var t = el('statTabs');
  if (t) t.innerHTML = statTabsHtml(ownerId);
  var s2 = el('statSummary');
  if (s2) s2.innerHTML = statSummaryHtml(ownerId);
  var f = el('statFoot');
  if (f) f.innerHTML = statFootHtml(ownerId);
}

function statsCard(){
  var who = state.ui.statOwner || 'soyeon';
  if (who !== 'ima' && who !== 'kwon' && who !== 'soyeon') who = 'soyeon';
  var items = statsOf(who);
  var me = ownerById(who);

  var body;
  if (items.length) {
    body = '<div id="statSummary">'+statSummaryHtml(who)+'</div>'
      + items.map(function(it){ return statItemRow(who, it); }).join('')
      + '<div id="statFoot">'+statFootHtml(who)+'</div>';
  } else {
    body = '<div class="empty-guide">'
      + '<b>'+esc(me.name)+' 실적 항목을 추가해 보세요</b>'
      + '<p>예) 상담 건수 0/10 · 신규 회원 0/5 · 진단 0/8<br>항목 이름 · 목표 · 단위를 자유롭게 정할 수 있고, 나중에 언제든 고칠 수 있어요.</p>'
      + '</div>';
  }

  return '<div class="card">'
    + '<div class="card-h"><div><h2>🎯 실적 현황</h2>'
    +   '<p class="sub">개인별 실적 · 목표를 다 채우면 All Star</p></div>'
    +   '<span class="dday">'+ddayLabel()+'</span></div>'
    + '<div class="who-tabs st-fit" id="statTabs">'+statTabsHtml(who)+'</div>'
    + body
    + '<button class="btn ghost sm wide" data-act="statAdd" data-owner="'+who+'">＋ '+esc(me.short)+' 실적 항목 추가</button>'
    + '</div>';
}

function filterChips(kind, current, withCount){
  var list = kind === 'task' ? TASK_FILTERS : FILTERS;
  return '<div class="who-tabs wrap">'+list.map(function(o){
    var on = o.id === current;
    var extra = '';
    if (withCount && kind === 'task') {
      extra = ' <b style="font-size:11px;color:#B4A492">'+countOpenTasks(o.id)+'</b>';
    }
    return '<button class="who'+(on?' on':'')+'" data-act="filter" data-kind="'+kind+'" data-owner="'+o.id+'">'
      + '<span class="who-av">'+o.emoji+'</span><span class="who-nm">'+esc(o.name)+'</span>'+extra+'</button>';
  }).join('')+'</div>';
}

/* 일정 상단용 작은 사람 필터 (좁은 화면에 5개 한 줄) */
function schedPersonChips(f){
  f = f || 'all';
  return '<div class="pchips">'+FILTERS.map(function(o){
    var nm = o.id === 'all' ? '전체' : (o.id === 'common' ? '공통' : o.name);
    return '<button class="pchip'+(o.id === f ? ' on' : '')+'" data-act="filter" data-kind="sched" data-owner="'+o.id+'">'+esc(nm)+'</button>';
  }).join('')+'</div>';
}

function tasksCard(){
  var f = state.ui.taskOwner;
  if (!isOwnerId(f)) f = TASK_OWNER_DEFAULT;
  var list = tasksFor(f);
  var rows = list.length ? list.map(function(t){
    var o = ownerById(t.owner);
    return '<div class="row'+(t.done?' on':'')+'">'
      + '<button class="ck'+(t.done?' on':'')+'" data-act="taskToggle" data-id="'+t.id+'" aria-label="할 일 체크">'+(t.done?'✓':'')+'</button>'
      + '<span class="r-b"><b>'+esc(t.title)+'</b>'
      +   '<small>'+o.emoji+' '+esc(o.short)+'</small></span>'
      + '<button class="t-btn del" data-act="taskDel" data-id="'+t.id+'" aria-label="할 일 삭제">✕</button>'
      + '</div>';
  }).join('') : '<p class="empty">할 일을 적어 두면 여기서 바로 체크할 수 있어요</p>';

  return '<div class="card">'
    + '<div class="card-h"><div><h2>✅ 담당자별 할 일 · 메모</h2>'
    +   '<p class="sub">오늘 할 일을 빠르게 적고 콕 체크</p></div>'
    +   '<span class="tk">'+countOpenTasks(f)+'개 남음</span></div>'
    + filterChips('task', f, true)
    + rows
    + '<div class="add-inline">'
    +   '<input id="taskInput" type="text" maxlength="60" placeholder="'+esc(ownerById(f).short)+' 할 일·메모 적기">'
    +   '<button class="btn sm" data-act="taskAdd" data-owner="'+f+'">추가</button></div>'
    + '</div>';
}

function upcomingCard(){
  var list = state.deadlines.filter(function(d){ return !d.done && d.date >= today(); })
    .slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); })
    .slice(0,4);
  var rows = list.length ? list.map(function(d){
    var o = ownerById(d.owner);
    return '<div class="dl-row">'
      + '<span class="dd">'+mdLabel(d.date)+'</span>'
      + '<span class="dl-b" data-act="dlEdit" data-id="'+d.id+'" role="button" tabindex="0">'
      +   '<b>'+esc(d.title)+'</b>'+(d.note?'<small>'+esc(d.note)+'</small>':'')+'</span>'
      + '<i class="av xs" style="background:'+o.color+'">'+o.emoji+'</i>'
      + ddChip(d.date)
      + '</div>';
  }).join('') : '<p class="empty">남은 마감이 없어요 🎉</p>';
  return '<div class="card">'
    + '<div class="card-h"><div><h2>⏰ 다가오는 마감</h2>'
    +   '<p class="sub">업무등록 마감 '+mdLabel(MY_DEADLINE)+' · '+ddayLabel()+'</p></div></div>'
    + rows + '</div>';
}

function renderHome(){
  el('home-weather').innerHTML = weatherCard();
  el('home-today').innerHTML = todayCard();
  el('home-stats').innerHTML = statsCard();
  el('home-tasks').innerHTML = tasksCard();
  el('home-deadlines').innerHTML = upcomingCard();
}

/* ---- 일정 페이지 ---- */
function weekBlock(ds){
  var list = schedFiltered(ds);
  var dd = parseYmd(ds);
  var isT = ds === today();
  var rows = list.length
    ? list.map(function(s){ return schedRow(s, { del:true, edit:true }); }).join('')
    : '<p class="empty sm">일정 없음</p>';
  return '<div class="day-block'+(isT?' today':'')+'">'
    + '<div class="day-h"><b>'+WD[dd.getDay()]+'요일</b>'
    +   '<span>'+(dd.getMonth()+1)+'/'+dd.getDate()+(isT?' · 오늘':'')+' · '+list.length+'건</span></div>'
    + '<div style="padding-top:2px">'+rows+'</div></div>';
}

function dpRow(s){
  var t;
  if (s.start) {
    t = '<i>'+esc(s.start)+'</i>' + (s.end ? '<i class="end">~'+esc(s.end)+'</i>' : '');
  } else if (s.kind === 'date' && s.endDate) {
    t = '<i class="allday">'+mdLabel(s.date)+'~</i>';
  } else {
    t = '<i class="allday">종일</i>';
  }
  return '<div class="dp-row">'
    + '<span class="dp-t">'+t+'</span>'
    + '<span class="dp-b" data-act="schedEdit" data-id="'+s.id+'" role="button" tabindex="0">'
    +   '<b>'+esc(s.title)+'</b>'
    +   (s.note ? '<small>'+esc(s.note)+'</small>' : '')
    + '</span>'
    + '<span class="dp-tools">'
    +   '<button class="x-btn" data-act="schedEdit" data-id="'+s.id+'" aria-label="일정 수정">✏️</button>'
    +   '<button class="x-btn" data-act="schedDel" data-id="'+s.id+'" aria-label="일정 삭제">✕</button>'
    + '</span></div>';
}

function dpVisits(ds, f){
  var list = dayVisits(ds, f);
  if (!list.length) return '';
  return '<div class="dp-grp">'
    + '<div class="dp-grp-h"><i class="dp-i">🤝</i>방문 · 준비물<span>'+list.length+'</span></div>'
    + list.map(function(v){
        var o = ownerById(v.owner);
        var items = (v.checklist || []).map(function(c){
          return '<div class="v-item'+(c.done?' done':'')+'">'
            + '<button class="vc'+(c.done?' on':'')+'" data-act="viToggle" data-vid="'+v.id+'" data-id="'+c.id+'" aria-label="준비물 체크">'+(c.done?'✓':'')+'</button>'
            + '<span>'+esc(c.title)+'</span></div>';
        }).join('');
        return '<div class="dp-v">'
          + '<div class="dp-v-h"><b>'+esc(v.customer)+'</b>'
          +   '<span>'+(v.time ? esc(v.time)+' · ' : '')+o.emoji+' '+esc(o.short)+'</span>'
          +   '<span class="pill'+(v.done?' ok':'')+'">'+(v.done?'완료':'예정')+'</span>'
          +   '<button class="x-btn" data-act="visitEdit" data-id="'+v.id+'" aria-label="방문 수정">✏️</button></div>'
          + (v.memo ? '<p class="v-memo">'+esc(v.memo)+'</p>' : '')
          + '<div class="v-ck">'+items+'</div></div>';
      }).join('')
    + '</div>';
}

function dpDeadlines(ds, f){
  var list = dayDeadlines(ds).filter(function(d){ return ownerMatch(d.owner, f); });

  return '<div class="dp-grp">'
    + '<div class="dp-grp-h"><i class="dp-i">⏰</i>이 날 마감<span>'+list.length+'</span></div>'
    + list.map(function(d){
        var o = ownerById(d.owner);
        return '<div class="dp-row">'
          + '<span class="dp-t"><i class="allday">마감</i></span>'
          + '<span class="dp-b" data-act="dlEdit" data-id="'+d.id+'" role="button" tabindex="0">'
          +   '<b>'+esc(d.title)+'</b>'
          +   '<small class="dp-own">'+o.emoji+' '+esc(o.short)+(d.note ? ' · '+esc(d.note) : '')+'</small></span>'
          + '<span class="dp-tools"><button class="x-btn" data-act="dlToggle" data-id="'+d.id+'" aria-label="마감 체크">'+(d.done?'✓':'○')+'</button></span>'
          + '</div>';
      }).join('')
    + '</div>';
}

function dayPanel(ds){
  var all = daySchedules(ds);
  var f = state.ui.schedOwner || 'all';
  var dd = parseYmd(ds);
  var isT = ds === today();
  var cCnt = ownerDayCount(ds, 'common');
  var tCnt = ownerDayCount(ds, 'all');

  if (f === 'all') {
    subTxt += '공통 '+cCnt + (tCnt - cCnt > 0 ? ' · 개인 '+(tCnt - cCnt) : '');
  } else {
    subTxt += esc(ownerById(f).name) + ' · ' + ownerDayCount(ds, f) + '건';
  }

  var people = FILTERS.map(function(o){
    var n = ownerDayCount(ds, o.id);
    var nm = o.id === 'all' ? '전체' : (o.id === 'common' ? '공통' : o.name);
    return '<button class="dp-p'+(o.id === f ? ' on' : '')+'" data-act="filter" data-kind="sched" data-owner="'+o.id+'">'

function monthView(){
  var ym = state.ui.monthAnchor || today().slice(0,7);
  if (!/^\d{4}-\d{2}$/.test(ym)) ym = today().slice(0,7);
  var cells = monthGrid(ym);
  var f = state.ui.schedOwner || 'all';
  var sel = state.ui.selDate || today();
  if (sel.slice(0,7) !== ym) sel = ym + '-01';
  var y = ym.slice(0,4), mo = Number(ym.slice(5,7));
  /* 달력에 칩으로 보일 사람: 전체면 내(김소연) 일정, 공통만 고르면 null */
  var focus = (f === 'common') ? null : (f === 'all' ? MY_ID : f);
  var head = '<div class="cal-h">'+['월','화','수','목','금','토','일'].map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div>';

  var grid = cells.map(function(ds){
    if (!ds) return '<span class="cal-e"></span>';
    var dd = parseYmd(ds);
    var all = schedulesForDate(ds);
    var commons = all.filter(function(s){ return s.owner === 'common'; });
    var own = focus ? all.filter(function(s){ return s.owner === focus; }) : [];
    var owners = [];
    all.forEach(function(s){ if (s.owner !== 'common' && owners.indexOf(s.owner) < 0) owners.push(s.owner); });

    var items = own.slice(0,1).concat(commons);
    var cap = 3;
    var show = items.slice(0, cap);
    var hidden = all.length - show.length;

    var chips = show.map(function(s){
      var isOwn = s.owner !== 'common';
      var st = isOwn ? ' style="background:'+ownerById(s.owner).color+'"' : '';
      return '<span class="cal-chip'+(isOwn?' who':'')+'"'+st+' title="'+esc(s.title)+'">'+esc(chipLabel(s))+'</span>';
    }).join('');

    var dots = owners.map(function(k){
      var o = ownerById(k);
      var dim = (focus && k !== focus) ? ' class="dim"' : '';
      return '<i'+dim+' style="background:'+o.dot+'" title="'+esc(o.short)+'"></i>';
    }).join('');
    if (hidden > 0) dots += '<i class="cal-more" title="일정 '+all.length+'건">+'+hidden+'</i>';

    var cls = 'cal-d' + (all.length ? ' has' : '')
      + (ds === today() ? ' today' : '')
      + (ds === sel ? ' sel' : '')
      + (dd.getDay() === 0 ? ' sun' : '')
      + (dd.getDay() === 6 ? ' sat' : '');
    return '<button class="'+cls+'" data-act="daySelect" data-date="'+ds+'" aria-label="'+esc(kdate(ds))+' 일정 '+dayEventCount(ds)+'건">'
      + '<span class="n">'+dd.getDate()+'</span>'
      + (chips ? '<span class="cal-chips">'+chips+'</span>' : '')
      + '<span class="cal-ow">'+dots+'</span>'
      + '</button>';
  }).join('');

  return '<div class="nav">'
      + '<button class="nav-b" data-act="monthPrev" aria-label="지난 달">◀</button>'
      + '<b>'+y+'년 '+mo+'월</b>'
      + '<button class="nav-b" data-act="monthNext" aria-label="다음 달">▶</button>'
      + '<button class="nav-t" data-act="gotoToday">오늘</button></div>'
    + '<div class="who-scroll">'+schedPersonChips(f)+'</div>'
    + head + '<div class="cal">'+grid+'</div>'
    + '<div class="cal-legend">'
    +   '<span><i class="lg-chip"></i>공통 일정</span>'
    +   OWNERS.filter(function(o){ return o.id !== 'common'; }).map(function(o){
          return '<span><i style="background:'+o.dot+'"></i>'+esc(o.short)+'</span>';
        }).join('')
    +   '<span class="lg-note">점 = 그날 개인 일정</span>'

/* ---------- 7. 날씨 ---------- */
function wmo(code){
  var c = Number(code) || 0;
  if (c === 0) return { emoji:'☀️', label:'맑음' };
  if (c === 1) return { emoji:'🌤️', label:'대체로 맑음' };
  if (c === 2) return { emoji:'⛅', label:'구름 조금' };
  if (c === 3) return { emoji:'☁️', label:'구름 많음' };
  if (c === 45 || c === 48) return { emoji:'🌫️', label:'안개' };
  if (c >= 51 && c <= 57) return { emoji:'🌦️', label:'이슬비' };
  if (c >= 61 && c <= 65) return { emoji:'🌧️', label:'비' };
  if (c === 66 || c === 67) return { emoji:'🌧️', label:'진눈깨비' };
  if (c >= 71 && c <= 77) return { emoji:'❄️', label:'눈' };
  if (c >= 80 && c <= 82) return { emoji:'🌦️', label:'소나기' };
  if (c === 85 || c === 86) return { emoji:'🌨️', label:'눈 소나기' };
  if (c >= 95) return { emoji:'⛈️', label:'천둥번개' };
  return { emoji:'🌤️', label:'알 수 없음' };
}
function isRainy(c){ c = Number(c)||0; return (c>=51&&c<=67) || (c>=80&&c<=82) || c>=95; }
function isSnowy(c){ c = Number(c)||0; return (c>=71&&c<=77) || c===85 || c===86; }
function weatherBadges(w){
  var out = [];
  var tmax = Number(w.tmax), tmin = Number(w.tmin), pop = Number(w.pop)||0, code = Number(w.code)||0;
  if (pop >= 40 || isRainy(code)) out.push({ k:'rain', e:'☂️', t:'우산 챙기기' });
  if (tmin <= 11 || (tmax - tmin) >= 10) out.push({ k:'coat', e:'🧥', t:'겉옷 챙기기' });
  if (tmax >= 23) out.push({ k:'water', e:'💧', t:'물병 챙기기' });
  if (isSnowy(code) || tmin <= 0) out.push({ k:'snow', e:'🧤', t:'장갑 챙기기' });
  if (!out.length) out.push({ k:'none', e:'😎', t:'오늘은 챙길 것 없음' });
  return out;
}

function loadWeather(){
  weather = { status:'loading', data:null, stale:false };
  renderHome();
  var ctrl = null, timerId = null;
  try {
    if (typeof AbortController !== 'undefined') {
      ctrl = new AbortController();
      timerId = setTimeout(function(){ ctrl.abort(); }, 8000);
    }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=35.824&longitude=128.545'
      + '&current=temperature_2m,weather_code'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code'
      + '&timezone=Asia%2FSeoul&forecast_days=1';
    fetch(url, ctrl ? { signal: ctrl.signal } : {})
      .then(function(r){ if (!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(j){
        if (timerId) clearTimeout(timerId);
        var daily = j.daily || {};
        var cur = Math.round(Number((j.current||{}).temperature_2m));
        var tmax = Math.round(Number(daily.temperature_2m_max[0]));
        var tmin = Math.round(Number(daily.temperature_2m_min[0]));
        var pop = Math.round(Number((daily.precipitation_probability_max||[0])[0]) || 0);
        var code = Number(((daily.weather_code||[])[0] !== undefined ? daily.weather_code[0] : (j.current||{}).weather_code)) || 0;
        var meta = wmo(code);
        var now = new Date();
        weather = { status:'ok', stale:false, savedAt: today(), data:{
          cur: cur, tmax: tmax, tmin: tmin, pop: pop, code: code,
          emoji: meta.emoji, label: meta.label,
          time: pad2(now.getHours())+':'+pad2(now.getMinutes()),
          badges: weatherBadges({ tmax:tmax, tmin:tmin, pop:pop, code:code })
        }};
        try { localStorage.setItem(WEATHER_KEY, JSON.stringify(weather)); } catch(e){}
        renderHome();
      })
      .catch(function(){
        if (timerId) clearTimeout(timerId);
        fallbackWeather();
      });
  } catch(e){
    fallbackWeather();
  }
}
function fallbackWeather(){
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(WEATHER_KEY) || 'null'); } catch(e){}
  if (cached && cached.data && cached.savedAt === today()) {
    weather = { status:'ok', stale:true, data: cached.data };
  } else {
    weather = { status:'error', data:null, stale:false };
  }
  renderHome();
}

/* ---------- 8. 소리 · 효과 ---------- */
var actx = null;
function audio(){
  try {
    if (!actx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      actx = new Ctx();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch(e){ return null; }
}
function chime(){
  var a = audio(); if (!a) return;
  var t0 = a.currentTime, notes = [660, 880, 1180];
  notes.forEach(function(f, i){
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    o.connect(g); g.connect(a.destination);
    var s = t0 + i*0.09;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.14, s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s+0.3);
    o.start(s); o.stop(s+0.32);
  });
}
